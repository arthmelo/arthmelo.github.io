<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#07121a">
<title>Petróleo e Refino 3D</title>
<meta name="description" content="Simulação 3D didática do refino de petróleo, baseada na apostila Petróleo e Refino (Tecnologia Orgânica I, EQO 364).">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 64 64%22%3E%3Crect x=%2218%22 y=%2210%22 width=%2214%22 height=%2246%22 rx=%224%22 fill=%22%23c7cfd6%22/%3E%3Crect x=%2236%22 y=%2224%22 width=%2212%22 height=%2232%22 rx=%224%22 fill=%22%239fb6c6%22/%3E%3Crect x=%2218%22 y=%2218%22 width=%2214%22 height=%225%22 fill=%22%23ffd94a%22/%3E%3Crect x=%2218%22 y=%2230%22 width=%2214%22 height=%225%22 fill=%22%23ffa23a%22/%3E%3Crect x=%2218%22 y=%2242%22 width=%2214%22 height=%225%22 fill=%22%23b0643a%22/%3E%3Crect x=%228%22 y=%2256%22 width=%2248%22 height=%224%22 rx=%222%22 fill=%22%235a6b78%22/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fira+Sans:wght@400;500;600;700&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap" rel="stylesheet">
<style>
/* =====================================================================
   ESTILOS
   ===================================================================== */
:root{
  --pw: clamp(360px, 28vw, 520px);
  --azul: #1f4e79;            /* azul-petróleo da apostila */
  --azul-2: #2b6a99;
  --ink: #1d2731;
  --ink-2: #4a5866;
  --paper: #fbfcfd;
  --line: #d5dfe8;
  --sep: #e0a526;  --sep-bg:#fff1cc; --sep-ink:#6b4a00;
  --conv:#46a36a;  --conv-bg:#ddf1e2; --conv-ink:#1e5b31;
  --trat:#4a8fc9;  --trat-bg:#dcebf7; --trat-ink:#1d4f78;
  --ui-bg: rgba(8,18,26,.84);
  --ui-line: rgba(255,255,255,.14);
  --ui-ink: #e6eef4;
  --sans: 'Fira Sans', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  --serif: 'Source Serif 4', Georgia, 'Times New Roman', serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#08121a;color:var(--ui-ink);font-family:var(--sans)}
button{font-family:inherit}
#app{display:grid;grid-template-columns:minmax(0,1fr) var(--pw);height:100vh;height:100dvh;transition:grid-template-columns .35s ease}
body.panel-closed #app{grid-template-columns:minmax(0,1fr) 0px}

/* ---------- palco 3D ---------- */
#stage{position:relative;overflow:hidden;min-width:0;
  background:radial-gradient(ellipse 90% 70% at 45% 30%, #1d3a4d 0%, #10263a 42%, #08131c 100%)}
#stage canvas{display:block;width:100%;height:100%;touch-action:none}
#labels{position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:2}
#labels.hide-all .lbl{opacity:0!important;pointer-events:none!important}
#labels.hide-minor .lbl:not(.lbl-unit):not(.lbl-area){opacity:0!important}
.lbl{position:absolute;left:0;top:0;white-space:nowrap;transform:translate(-9999px,0);transition:opacity .25s ease;will-change:transform;opacity:1}
.lbl.off{opacity:0!important;pointer-events:none!important}
.lbl-unit{pointer-events:auto;cursor:pointer;background:rgba(9,21,31,.86);border:1px solid rgba(255,255,255,.16);
  border-left:4px solid var(--sc,#8fb3c9);padding:4px 8px 4px 7px;border-radius:6px;font-size:13px;font-weight:500;
  color:#eef4f8;display:flex;gap:7px;align-items:center;box-shadow:0 2px 10px rgba(0,0,0,.35)}
.lbl-unit .chip{display:none;font-size:9.5px;font-weight:700;letter-spacing:.07em;padding:1px 5px;border-radius:3px;background:var(--sc);color:#0f1e28}
.lbl-unit.chip-on .chip{display:inline-block}
#labels.compact .lbl-unit{font-size:12px;padding:2px 7px 2px 6px;gap:5px}
#labels.compact .lbl-unit.focus{font-size:13px}
#labels.compact .lbl-unit .chip{font-size:8.5px;padding:0 4px}
.lbl-unit.hot{background:#123a52;border-color:#79bde6}
.lbl-unit.focus{background:#16435e;border-color:#9fd3f2;font-size:14px}
.lbl-flow{font-size:11px;font-weight:600;padding:1px 7px;border-radius:10px;background:rgba(8,16,24,.82);color:#fff;border:1.5px solid var(--c)}
.lbl-eq{font-size:11.5px;color:#dce8f0;background:rgba(8,16,24,.7);padding:2px 6px;border-radius:4px;border:1px solid rgba(255,255,255,.1)}
.lbl-tank{font-size:11.5px;color:#e4edf3;background:rgba(8,16,24,.72);padding:2px 7px;border-radius:4px;border-bottom:2px solid var(--c,#8aa)}
.lbl-geo{font-size:12px;color:#15222c;background:rgba(255,255,255,.88);padding:2px 7px;border-radius:4px;font-weight:500}
.lbl-area{font-size:14px;letter-spacing:.2em;text-transform:uppercase;color:rgba(190,220,238,.5);font-weight:600}

/* ---------- barra superior ---------- */
#topbar{position:absolute;top:10px;left:12px;right:12px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;pointer-events:none;z-index:5}
#topbar>*{pointer-events:auto}
.brand{display:flex;flex-direction:column;line-height:1.1;padding:6px 12px;background:var(--ui-bg);border:1px solid var(--ui-line);border-radius:8px}
.brand b{font-size:15px;letter-spacing:.01em}
.brand small{font-size:11px;color:#9fb6c6}
.seg{display:flex;background:var(--ui-bg);border:1px solid var(--ui-line);border-radius:8px;padding:3px;gap:2px}
.seg button{background:none;border:0;color:#c9d8e2;padding:7px 12px;border-radius:6px;cursor:pointer;font-size:13px;font-weight:500}
.seg button.on{background:var(--azul-2);color:#fff}
.tools{margin-left:auto;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.btn{background:var(--ui-bg);color:var(--ui-ink);border:1px solid var(--ui-line);border-radius:7px;padding:7px 11px;font-size:13px;font-weight:500;cursor:pointer;line-height:1.2}
.btn:hover{border-color:#6fb3dc}
.btn:focus-visible,.seg button:focus-visible,.tl-step:focus-visible{outline:2px solid #ffd84a;outline-offset:2px}
.btn.primary{background:var(--azul-2);border-color:var(--azul-2);color:#fff}
.speed{display:flex;align-items:center;gap:7px;background:var(--ui-bg);border:1px solid var(--ui-line);border-radius:7px;padding:5px 10px;font-size:12.5px}
.speed input{width:86px;accent-color:#6fb3dc}
.speed output{min-width:34px;text-align:right;font-variant-numeric:tabular-nums}

/* ---------- legenda ---------- */
#legend{position:absolute;left:12px;top:66px;background:var(--ui-bg);border:1px solid var(--ui-line);border-radius:8px;padding:7px 11px 8px;font-size:12px;z-index:4;max-width:340px}
#legend header{display:flex;justify-content:space-between;align-items:center;gap:10px;cursor:pointer;font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:#9fb6c6;font-weight:600}
#legend ul{list-style:none;margin:6px 0 0;padding:0;display:grid;grid-template-columns:auto auto;column-gap:14px}
#legend li{display:flex;align-items:center;gap:7px;line-height:1.55;color:#dfe9f0;white-space:nowrap;cursor:default}
#legend li i{flex:0 0 11px;width:11px;height:11px;border-radius:50%;background:var(--c);box-shadow:0 0 6px var(--c)}
#legend li i.cube{border-radius:2px}
#legend.min ul{display:none}
#legend .lg-hint{margin-top:5px;color:#8ea7b8;font-size:11px;line-height:1.35;max-width:310px}
#legend.min .lg-hint{display:none}

/* ---------- barra inferior: tour + linha do tempo ---------- */
#bottom{position:absolute;left:0;right:0;bottom:0;padding:26px 12px 10px;z-index:4;
  background:linear-gradient(to top, rgba(5,12,18,.96) 0%, rgba(5,12,18,.82) 60%, rgba(5,12,18,0) 100%);pointer-events:none}
#bottom>*{pointer-events:auto}
#tourbar{display:flex;justify-content:center;align-items:center;gap:10px;margin-bottom:9px}
body.mode-explorar #tourbar{display:none}
#tourbar .btn{font-size:15px;padding:9px 16px}
#stepinfo{min-width:260px;max-width:46vw;text-align:center;font-size:14px;color:#d3e3ec;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#stepinfo b{color:#fff}
#timeline{display:flex;align-items:flex-end;gap:8px}
.tl-home{flex:0 0 auto;align-self:flex-end;margin-bottom:2px;width:36px;height:36px;border-radius:8px;background:var(--ui-bg);border:1px solid var(--ui-line);color:#cfe0ea;cursor:pointer;font-size:17px}
.tl-home.on{background:#ffd84a;color:#0d1d28;border-color:#fff}
.tl-track{flex:1;display:flex;gap:clamp(3px, .5vw, 6px);min-width:0;container-type:inline-size}
.tl-group{flex:var(--n) 1 0;min-width:calc(var(--tw) * 6.2px);display:flex;flex-direction:column}
.tl-part{font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;color:#a7c1d2;border-bottom:2px solid var(--pc);padding-bottom:3px;margin-bottom:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}
.tl-steps{display:flex}
.tl-step{flex:1 1 0;min-width:0;background:none;border:0;color:#b9cbd6;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:5px;padding:0 2px 2px;position:relative;font-size:12px}
.tl-step i{width:13px;height:13px;border-radius:50%;border:2px solid #6f8ea2;background:#0c1922;position:relative;z-index:1;transition:transform .2s}
.tl-step::before{content:'';position:absolute;top:6px;left:-50%;right:50%;height:2px;background:#36515f}
.tl-step:first-child::before{display:none}
.tl-step span{max-width:100%;overflow:hidden;text-align:center;line-height:1.15;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:3;overflow-wrap:anywhere;hyphens:manual;text-wrap:balance}
@container (max-width: 1000px){ .tl-step{font-size:11px} }
@container (max-width: 900px){ .tl-part{font-size:9.5px;letter-spacing:.03em} .tl-group{min-width:calc(var(--tw) * 5.2px)} .tl-step{padding:0 1px 2px} }
.tl-step:hover span{color:#fff}
.tl-step.seen i{background:#3f7396;border-color:#5f95b8}
.tl-step.on i{background:#ffd84a;border-color:#fff;box-shadow:0 0 0 4px rgba(255,216,74,.25);transform:scale(1.25)}
.tl-step.on span{color:#fff;font-weight:600}
.tl-arrow{align-self:flex-end;color:#5d7d90;font-size:13px;margin-bottom:21px}

/* ---------- tooltip ---------- */
#tip{position:absolute;left:0;top:0;pointer-events:none;background:#0d2433;border:1px solid #4f8fb7;color:#fff;padding:7px 11px;border-radius:7px;font-size:13.5px;opacity:0;transition:opacity .15s;z-index:6;max-width:280px}
#tip.show{opacity:1}
#tip small{display:block;color:#a9c6d8;margin-top:3px;font-size:12px}
#tip .tchip{display:inline-block;font-size:10px;font-weight:700;letter-spacing:.07em;padding:1px 5px;border-radius:3px;margin-top:5px;color:#0f1e28}

/* ---------- cenas detalhadas: rótulos, painel de controles (dock), transição ---------- */
.lbl-sc{font-size:12.5px;color:#eef4f8;background:rgba(8,16,24,.8);padding:3px 8px;border-radius:5px;border-left:3px solid var(--c,#8fb3c9)}
.lbl-sc small{display:block;color:#a9c6d8;font-size:11px;font-weight:400}
.lbl-sc.cur{background:#1d4a66;border-color:#ffd84a;color:#fff}
.lbl-sc.dim{opacity:.55}
.lbl-sc.wrap{white-space:normal;width:max-content;max-width:172px}
.lbl-hd{font-size:12.5px;letter-spacing:.14em;text-transform:uppercase;color:#bcd6e8;font-weight:600}
.lbl-mol{font-size:12px;color:#e9f1f6;background:rgba(8,16,24,.72);padding:2px 8px;border-radius:10px;text-align:center;line-height:1.3;white-space:normal;width:max-content;max-width:136px}
.lbl-mol small{display:block;color:#9fc0d6;font-size:10.5px}
.lbl-mol.sel{background:#1d4a66;box-shadow:0 0 0 1.5px #ffd84a}
#fade{position:absolute;inset:0;background:#0b1a25;opacity:0;pointer-events:none;z-index:3;transition:opacity .45s ease}
#dock{position:absolute;left:12px;top:66px;width:min(352px,34vw);overflow-y:auto;background:var(--ui-bg);border:1px solid var(--ui-line);border-radius:10px;
  padding:10px 12px 12px;z-index:4;display:none;font-size:13px;line-height:1.42;color:#e1ebf2;scrollbar-width:thin}
body.in-scene #dock{display:block}
body.in-scene #legend{display:none}
.dk-top{display:flex;align-items:center;gap:8px}
.dk-top .btn{white-space:nowrap;flex:none}
.dk-seal{font-size:10px;font-weight:700;letter-spacing:.07em;padding:2px 6px;border-radius:3px;color:#0f1e28;min-width:0;line-height:1.3}
.dk-min{margin-left:auto;background:none;border:0;color:#9fb6c6;font-size:18px;cursor:pointer;padding:0 4px;line-height:1}
.dk-title{margin:7px 0 6px}
.dk-title small{display:block;font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:#9fb6c6;font-weight:600}
.dk-title b{font-size:16px;color:#fff;line-height:1.2}
.dk-views{margin:0 0 6px}
.dk-views button{flex:1 1 0;padding:7px 8px;font-size:12.5px}
.dk-ctl{margin:7px 0}
.dk-lab{display:flex;justify-content:space-between;gap:8px;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:#9fb6c6;font-weight:600;margin-bottom:4px}
.dk-lab output{text-transform:none;letter-spacing:0;color:#ffd84a;font-weight:600}
.dk-ctl .seg{flex-wrap:wrap}
.dk-ctl .seg button{flex:1 1 auto;padding:6px 7px;font-size:12.5px;white-space:normal;line-height:1.2}
.dk-ctl input[type=range]{width:100%;accent-color:#ffd84a;margin:2px 0}
.dk-scale{display:flex;justify-content:space-between;font-size:10.5px;color:#8ea7b8}
.dk-row{display:flex;gap:6px;flex-wrap:wrap;margin:9px 0 4px}
.dk-row .btn{flex:1 1 auto}
.dk-tog{display:flex;align-items:center;gap:9px;width:100%;background:rgba(255,255,255,.04);border:1px solid var(--ui-line);border-radius:7px;color:#e1ebf2;
  padding:7px 10px;cursor:pointer;font-size:13px;text-align:left;margin:5px 0}
.dk-tog:hover{border-color:#6fb3dc}
.dk-tog i{flex:0 0 30px;height:16px;border-radius:8px;background:#4a5a66;position:relative;transition:background .2s}
.dk-tog i::after{content:'';position:absolute;left:2px;top:2px;width:12px;height:12px;border-radius:50%;background:#fff;transition:transform .2s}
.dk-tog.on i{background:#3fa66a}
.dk-tog.on i::after{transform:translateX(14px)}
.dk-tog span{flex:1}
.dk-tog small{display:block;color:#9fb6c6;font-size:11.5px}
.dk-info{margin-top:10px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);border-left:3px solid var(--ic,#ffd84a);border-radius:7px;padding:8px 10px}
.dk-info:empty{display:none}
.dk-info h4{margin:0 0 3px;font-size:13.5px;color:#fff}
.dk-info h4 small{display:block;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:#9fb6c6;font-weight:600}
.dk-info p{margin:4px 0}
.dk-info ul{margin:4px 0;padding-left:17px}
.dk-info li{margin:2px 0}
.dk-info .src{font-size:11px;color:#8ea7b8;margin-top:5px}
.dk-info .go{font-size:12px;color:#ffe08a}
.dk-steps{list-style:none;padding:0;margin:6px 0}
.dk-steps li{display:flex;gap:8px;align-items:flex-start;padding:4px 6px;border-radius:6px;color:#9fb0bd;margin:2px 0;transition:background .3s,color .3s}
.dk-steps li>b{flex:0 0 20px;height:20px;border-radius:50%;background:#2a3b47;color:#cfe0ea;display:flex;align-items:center;justify-content:center;font-size:11.5px;transition:background .3s}
.dk-steps li.on{background:rgba(255,216,74,.12);color:#fff}
.dk-steps li.on>b{background:#ffd84a;color:#10202b}
.dk-steps li span b{color:#eef4f8}
.dk-meter{display:grid;grid-template-columns:auto 1fr;gap:3px 8px;align-items:center;font-size:12px;margin:6px 0}
.dk-bar{height:10px;background:#22323d;border-radius:5px;overflow:hidden;position:relative}
.dk-bar i{position:absolute;top:0;bottom:0;left:var(--l,0);width:var(--w,0);background:var(--c,#3f86f0);border-radius:5px;transition:width .4s,left .4s}
.dk-stack{display:flex;height:12px;border-radius:6px;overflow:hidden;background:#22323d;margin:4px 0}
.dk-stack i{display:block;height:100%;background:var(--c);transition:width .4s}
.dk-key{display:flex;flex-wrap:wrap;gap:3px 12px;font-size:12px;margin:6px 0}
.dk-key span{display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
.dk-key i{width:10px;height:10px;border-radius:50%;background:var(--c);border:1px solid rgba(0,0,0,.3);box-shadow:0 0 0 1px rgba(255,255,255,.18)}
.dk-hint{margin-top:9px;font-size:11.5px;color:#8ea7b8;line-height:1.35}
.dk-tag{display:inline-block;font-size:10px;font-weight:700;letter-spacing:.07em;padding:1px 5px;border-radius:3px;background:#3a4b57;color:#d6e4ee;vertical-align:1px}
.dk-tag-q{background:#8a3b2a;color:#fff}
.dk-thermo-cap{font-size:11px;color:#b8cad6;margin:8px 0 7px}
.dk-thermo{position:relative;height:12px;border-radius:6px;background:linear-gradient(90deg,#3f86f0,#9b7fc0 45%,#e0a526 70%,#e8684a);margin:0 0 22px}
.dk-thermo .z{position:absolute;top:-3px;bottom:-3px;left:var(--a);width:var(--b);border:1.5px solid #ff9d80;border-radius:3px;background:repeating-linear-gradient(135deg,rgba(20,8,4,.55) 0 3px,transparent 3px 6px)}
.dk-thermo .z span{position:absolute;top:calc(100% + 3px);right:-2px;white-space:nowrap;font-size:10.5px;color:#ffb39c}
.dk-thermo .m{position:absolute;top:-5px;bottom:-5px;left:var(--x);width:4px;margin-left:-2px;background:#fff;border-radius:2px;box-shadow:0 0 0 1.5px #0b141b}
.dk-thermo .m::before{content:'';position:absolute;left:50%;bottom:100%;transform:translateX(-50%);border:5px solid transparent;border-top-color:#fff}
.dk-tab{width:100%;border-collapse:collapse;font-size:11.5px;margin:6px 0;line-height:1.3}
.dk-tab th,.dk-tab td{padding:3px 4px;border-bottom:1px solid rgba(255,255,255,.08);text-align:left;vertical-align:top}
.dk-tab th{color:#9fb6c6;font-weight:600;font-size:10.5px;text-transform:uppercase;letter-spacing:.05em}
.dk-tab td:first-child{color:#b8cad6;white-space:nowrap}
.dk-tab tr.hl td{background:rgba(255,216,74,.1)}
.dk-eq{font-family:var(--serif);text-align:center;margin:7px 0;padding:5px 6px;background:rgba(255,255,255,.07);border-radius:6px;font-size:12.5px;color:#eef4f8;line-height:1.5}
.dk-eq small{font-size:10px;color:#9fb6c6;font-family:var(--sans,inherit)}
.dk-chart{display:block;width:100%;height:auto;margin:6px 0 4px}
.dk-chart text{fill:#9fb6c6;font-size:9.5px}
#dock.min .dk-title,#dock.min .dk-views,#dock.min .dk-body,#dock.min .dk-info,#dock.min .dk-hint{display:none}
.ph-scene{margin-top:10px;font:600 14px var(--sans);padding:8px 14px;border-radius:8px;border:1px solid var(--azul-2);background:var(--azul-2);color:#fff;cursor:pointer}
.ph-scene:hover{background:var(--azul)}
body.in-scene .ph-scene{display:none}
.roteiro.cena{background:#f3f0e4;color:#3d3520}
.roteiro.cena .rt{color:#7a6528}

/* ---------- botão de recolher o painel ---------- */
#panel-toggle{position:absolute;right:0;top:50%;transform:translateY(-50%);z-index:6;background:var(--paper);color:var(--azul);border:1px solid #c9d5df;border-right:0;border-radius:8px 0 0 8px;width:26px;height:64px;cursor:pointer;font-size:16px;font-weight:700;box-shadow:-2px 0 8px rgba(0,0,0,.25)}

/* ---------- painel lateral ---------- */
#panel{position:relative;background:var(--paper);color:var(--ink);display:flex;flex-direction:column;min-width:0;overflow:hidden;border-left:1px solid #c9d5df;font-family:var(--serif)}
.ph{padding:16px 22px 13px;border-bottom:1px solid #dfe6ec;font-family:var(--sans);position:relative;background:#fff}
.ph-close{position:absolute;top:10px;right:10px;border:0;background:none;font-size:22px;color:#7a8b99;cursor:pointer;line-height:1;padding:4px 8px;border-radius:6px}
.ph-close:hover{background:#eef2f6;color:var(--azul)}
.ph-kicker{font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:#5a7085;font-weight:600;padding-right:30px}
.ph-cap{font-size:12px;letter-spacing:.09em;color:var(--azul);font-weight:700;margin-top:7px;text-transform:uppercase}
.ph h2{margin:2px 0 9px;font-size:clamp(22px,1.65vw,30px);color:var(--azul);line-height:1.15;font-weight:700}
.seal{display:inline-flex;gap:8px;align-items:baseline;border-radius:6px;padding:5px 10px;font-size:13px;line-height:1.3}
.seal b{letter-spacing:.08em;font-size:12px}
.seal-separacao{background:var(--sep-bg);color:var(--sep-ink);border:1px solid #e9c46a}
.seal-conversao{background:var(--conv-bg);color:var(--conv-ink);border:1px solid #8fcca0}
.seal-tratamento{background:var(--trat-bg);color:var(--trat-ink);border:1px solid #93bfe3}
.seal-ex{margin-top:6px;font-size:13px;line-height:1.4;color:var(--ink-2)}
.pb{flex:1;overflow-y:auto;padding:14px 22px 48px;font-size:clamp(15px,.95vw,17.5px);line-height:1.56;scroll-behavior:smooth}
.pb p{margin:.55em 0}

.pb li{margin:.28em 0}

.pb h4{font-family:var(--sans);color:#24527a;font-size:.98em;margin:1.05em 0 .35em}
.pb sub,.pb sup{font-size:.72em;line-height:0}
.roteiro{font-family:var(--sans);background:#eef3f7;border-radius:8px;padding:10px 13px;margin:2px 0 14px;font-size:.95em;color:#24384a;line-height:1.45}
.roteiro .rt{display:block;font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:#5a7085;font-weight:700;margin-bottom:3px}
.box{border-radius:6px;border:1px solid;border-left-width:5px;padding:10px 14px 10px;margin:14px 0;position:relative}
.box .bt{font-family:var(--sans);font-weight:600;margin-bottom:4px;font-size:.95em;padding-right:8.5em}
.box .bk{position:absolute;top:9px;right:10px;font:700 9px var(--sans);letter-spacing:.09em;opacity:.65;text-transform:uppercase}
.box p:first-of-type{margin-top:.2em}
.box ul,.box ol{margin:.3em 0}
.box.conceito{background:#dde8f3;border-color:#bccfe2;border-left-color:var(--azul)}
.box.conceito .bk{color:var(--azul)}
.box.entender{background:#e4f2e6;border-color:#c3e0c7;border-left-color:#2e7d32}
.box.entender .bk{color:#2e7d32}
.box.atencao{background:#fbe6e6;border-color:#efc8c8;border-left-color:#b3383a}
.box.atencao .bk{color:#b3383a}
.box.resumo{background:#fdf3d6;border-color:#f0dfa6;border-left-color:#b8860b}
.box.resumo .bk{color:#946c08}
.ficha{border:1px solid var(--azul);border-radius:6px;overflow:hidden;margin:2px 0 16px;background:#f1f4f8}
.ficha header{background:var(--azul);color:#fff;font:600 13px var(--sans);padding:6px 12px}
.ficha dl{display:grid;grid-template-columns:max-content 1fr;gap:5px 14px;margin:0;padding:10px 12px}
.ficha dt{font-family:var(--sans);font-weight:600;font-size:.9em;padding-top:.1em}
.ficha dd{margin:0}
.tbl{overflow-x:auto;margin:12px 0}
.tbl table{border-collapse:collapse;width:100%;font-size:.88em;line-height:1.35}
.tbl th{font-family:var(--sans);font-weight:600;text-align:left;border-top:2px solid #26313b;border-bottom:1px solid #26313b;padding:6px 7px;font-size:.92em;color:#26313b;vertical-align:bottom}
.tbl td{padding:5px 7px;border-bottom:1px solid #e5ebf0;vertical-align:top}
.tbl tr:last-child td{border-bottom:2px solid #26313b}
.tbl caption{caption-side:bottom;text-align:left;font-size:.85em;color:#5b6a76;padding-top:6px}
.tbl .sw{display:inline-block;width:11px;height:11px;border-radius:50%;margin-right:6px;vertical-align:-1px;border:1px solid rgba(0,0,0,.25)}
.eq{font-family:var(--serif);text-align:center;margin:10px 0;padding:6px 8px;background:#f4f7fa;border-radius:6px;font-size:1.02em}
.eq .arr{display:inline-flex;flex-direction:column;align-items:center;line-height:1;margin:0 .3em;vertical-align:middle}
.eq .arr small{font-size:.62em;color:#4a5866}
.dl dt{font-family:var(--sans);font-weight:600;margin-top:.6em}
.dl dd{margin:.15em 0 0 1.1em}
.flow{display:flex;flex-wrap:wrap;align-items:center;gap:6px 6px;margin:12px 0;font-family:var(--sans);font-size:.83em}
.flow .n{padding:5px 9px;border-radius:5px;border:1px solid #6d8fb0;background:#dde8f3;color:#1f3550;line-height:1.25;text-align:center}
.flow .n.sep{background:#fff1cc;border-color:#d9a730;color:#5a4000}
.flow .n.conv{background:#ddf1e2;border-color:#5fa977;color:#1e5b31}
.flow .n.aux{background:#e4f2e6;border-color:#73b07a;color:#245a2a}
.flow .a{color:#5a6b78}
.flow .br{flex-basis:100%;height:0}
.bars{margin:12px 0;font-family:var(--sans);font-size:.84em}
.bars .row{display:grid;grid-template-columns:minmax(120px,46%) 1fr;gap:8px;align-items:center;margin:3px 0}
.bars .bar{height:16px;background:#e9eef2;border-radius:3px;position:relative;overflow:visible}
.bars .bar i{display:block;height:100%;border-radius:3px;background:var(--c);border:1px solid rgba(0,0,0,.18)}
.bars .bar span{position:absolute;left:calc(var(--w) + 6px);top:0;line-height:16px;font-size:.95em;color:#2a3946;font-variant-numeric:tabular-nums}
.bars .cap{font-size:.92em;color:#5b6a76;margin-top:6px;font-family:var(--serif)}
.torre{display:grid;grid-template-columns:22px 1fr;gap:0 12px;margin:12px 0;font-family:var(--sans);font-size:.86em}
.torre .grad{grid-row:1 / span 20;border-radius:6px;background:linear-gradient(to bottom,#4f86c6,#9fb7cf 35%,#e9b46a 70%,#c8432f);position:relative}
.torre .it{display:flex;align-items:center;gap:8px;padding:4px 0;border-bottom:1px dashed #dbe3ea}
.torre .it i{width:11px;height:11px;border-radius:50%;background:var(--c);border:1px solid rgba(0,0,0,.25);flex:0 0 11px}
.torre .lim{font-size:.88em;color:#5b6a76;padding:2px 0}
.svgfig{margin:12px 0;text-align:center}
.svgfig svg{max-width:100%;height:auto}
.svgfig figcaption{font-size:.84em;color:#5b6a76;text-align:left;margin-top:4px}
.see{margin:20px 0 4px;font-family:var(--sans);font-size:.88em;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.see span{color:#5b6a76;margin-right:2px}
.see button,.linkbtn{border:1px solid #b9cbdb;background:#f1f6fa;color:var(--azul);border-radius:14px;padding:4px 11px;cursor:pointer;font-size:1em;font-family:var(--sans)}
.see button:hover,.linkbtn:hover{background:#e2edf6}
.cta{display:flex;gap:10px;flex-wrap:wrap;margin:18px 0 6px}
.cta button{font:600 15px var(--sans);padding:10px 18px;border-radius:8px;border:1px solid var(--azul-2);cursor:pointer}
.cta .go{background:var(--azul-2);color:#fff}
.cta .alt{background:#fff;color:var(--azul)}
.seals{display:grid;gap:8px;margin:10px 0}
.seals .seal{display:flex}
.sol{margin:12px 0;font-family:var(--sans);font-size:.84em}
.sol .row{display:flex;justify-content:space-between;padding:0 4px;margin-bottom:4px}
.sol .ar{display:flex;align-items:center;gap:6px;color:#2a3946;margin:3px 0}
.sol .ar .ln{flex:1;height:2px;background:#2a3946;position:relative}
.sol .ar.r .ln::after{content:'';position:absolute;right:-1px;top:-4px;border-left:8px solid #2a3946;border-top:5px solid transparent;border-bottom:5px solid transparent}
.sol .ar.l .ln::before{content:'';position:absolute;left:-1px;top:-4px;border-right:8px solid #2a3946;border-top:5px solid transparent;border-bottom:5px solid transparent}

/* ---------- glossário ---------- */
#modal{position:fixed;inset:0;background:rgba(4,10,16,.62);display:none;align-items:center;justify-content:center;z-index:50}
#modal.open{display:flex}
#modal .card{background:var(--paper);color:var(--ink);max-width:780px;width:92vw;max-height:86vh;overflow:auto;border-radius:10px;padding:18px 26px 22px;font-family:var(--serif);position:relative}
#modal h2{font-family:var(--sans);color:var(--azul);margin:4px 0 10px}
#modal .ph-close{top:12px;right:12px}

/* ---------- telas estreitas ---------- */
@media (max-width: 860px){
  #app{grid-template-columns:minmax(0,1fr) 0px!important}
  #panel{position:fixed;left:0;right:0;bottom:0;height:56vh;height:56dvh;z-index:30;border-left:0;border-top:1px solid #c9d5df;border-radius:14px 14px 0 0;transition:transform .35s ease;box-shadow:0 -8px 30px rgba(0,0,0,.4)}
  body.panel-closed #panel{transform:translateY(102%)}
  #panel-toggle{top:auto;bottom:150px;transform:none}
  .brand small,.tl-step span,.tl-part{display:none}
  .tl-group{min-width:0}
  .tl-step.on span{display:block;position:absolute;bottom:-16px;font-size:11px;white-space:nowrap;max-width:none;overflow:visible}
  .tl-group:first-child .tl-step.on span{left:0}
  .tl-group:last-child .tl-step.on span{right:0}
  #legend{top:auto;bottom:150px}
  #stepinfo{min-width:0}
  .speed input{width:60px}
  #topbar{gap:6px}
  .tools{margin-left:0;gap:4px}
  .btn,.seg button{padding:6px 9px;font-size:12.5px}
  .speed{padding:4px 8px}
}
/* cena 3D em área estreita: controles viram uma faixa no topo (classe posta pelo measureUI) */
body.dock-top #dock{left:8px;right:8px;width:auto;height:min(40vh,360px);padding:8px 10px}
body.dock-top #dock.min{height:auto}
body.dock-top .dk-title{margin:5px 0}
body.dock-top .dk-hint{display:none}
@media (max-width: 560px){
  .brand{display:none}
  .speed{font-size:0;gap:4px}
  .speed output{font-size:12px}
  #tourbar .btn{font-size:13px;padding:7px 10px}
}
/* ---------- celular (classe body.mob, posta pelo mobApply): barra fina no topo, gaveta inferior com abas
   Texto/Controles e navegação ◀ ▶ na base; em paisagem a gaveta vira uma coluna à direita ---------- */
#mbar,#mmenu,#sheet,#mnav{display:none}
body.mob{--mb-h:52px;--mn-h:62px;-webkit-tap-highlight-color:transparent}
body.mob.land{--mb-h:46px;--mn-h:52px}
body.mob #topbar,body.mob #bottom,body.mob #legend,body.mob #panel-toggle{display:none!important}
body.mob #app{grid-template-columns:minmax(0,1fr) 0px!important;transition:none}
body.mob button{touch-action:manipulation}
.mb-ic{flex:none;width:44px;height:44px;border-radius:10px;border:1px solid var(--ui-line);background:var(--ui-bg);color:#e6eef4;font-size:19px;line-height:1;cursor:pointer;display:grid;place-items:center;padding:0}
.mb-ic:disabled{opacity:.3}
body.mob.land .mb-ic{height:38px}
body.mob #mbar{display:flex;position:fixed;left:0;right:0;top:0;height:calc(var(--mb-h) + env(safe-area-inset-top));padding:env(safe-area-inset-top) max(6px,env(safe-area-inset-right)) 0 max(6px,env(safe-area-inset-left));align-items:center;gap:6px;z-index:20;
  background:linear-gradient(to bottom,rgba(5,12,18,.94),rgba(5,12,18,.78));border-bottom:1px solid var(--ui-line);user-select:none;-webkit-user-select:none}
#mb-menu[aria-expanded=true]{background:var(--azul-2);border-color:var(--azul-2)}
#mb-title{flex:1;min-width:0;padding:0 4px;line-height:1.18}
#mb-title small{display:block;font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;color:#9fb6c6;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#mb-title b{display:block;font-size:15.5px;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
body.mob.menu-open #mmenu{display:block;position:fixed;left:max(6px,env(safe-area-inset-left));top:calc(var(--mb-h) + env(safe-area-inset-top) + 6px);width:min(340px,calc(100vw - 12px));
  max-height:calc(100dvh - var(--mb-h) - var(--mn-h) - env(safe-area-inset-top) - env(safe-area-inset-bottom) - 16px);overflow-y:auto;overscroll-behavior:contain;z-index:40;
  background:#0c1b26;border:1px solid rgba(255,255,255,.2);border-radius:12px;padding:12px 14px 14px;box-shadow:0 12px 40px rgba(0,0,0,.6);font-size:14px}
.mm-lab{display:flex;justify-content:space-between;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:#9fb6c6;font-weight:600;margin:14px 0 6px}
.mm-lab:first-child{margin-top:0}
.mm-lab output{color:#ffd84a;letter-spacing:0}
#mmenu .seg button{flex:1 1 0;min-height:42px;font-size:14px;padding:6px 8px;line-height:1.15}
#mmenu input[type=range]{width:100%}
.mm-btn{display:block;width:100%;min-height:44px;margin-top:14px;font-size:14.5px}
.mm-leg{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:1fr 1fr;gap:4px 10px;font-size:13px;color:#dfe9f0}
.mm-leg li{display:flex;align-items:center;gap:7px;line-height:1.35}
.mm-leg li i{flex:0 0 11px;width:11px;height:11px;border-radius:50%;background:var(--c);box-shadow:0 0 6px var(--c)}
.mm-leg li i.cube{border-radius:2px}
.mm-hint{margin-top:14px;padding:9px 11px;border-radius:8px;background:rgba(255,216,74,.08);border:1px solid rgba(255,216,74,.3);font-size:13px;line-height:1.45;color:#e9eef2}
body.mob #sheet{display:flex;flex-direction:column;position:fixed;left:0;right:0;bottom:calc(var(--mn-h) + env(safe-area-inset-bottom));height:48px;z-index:15;
  background:var(--paper);border-radius:16px 16px 0 0;box-shadow:0 -6px 24px rgba(0,0,0,.45);overflow:hidden;transition:height .28s ease}
body.mob #sheet.drag{transition:none}
body.mob.land #sheet{left:auto;right:env(safe-area-inset-right);width:min(46vw,430px);border-radius:14px 0 0 0}
#sheet-h{flex:none;height:48px;display:flex;align-items:center;gap:6px;padding:9px 8px 3px;position:relative;touch-action:none;cursor:grab;background:#0c1b26;user-select:none;-webkit-user-select:none}
#sheet-h .grip{position:absolute;left:50%;top:4px;width:40px;height:4px;margin-left:-20px;border-radius:2px;background:#5d7486}
.sh-tabs{flex:1;display:flex;gap:5px;min-width:0}
.sh-tabs button{flex:1 1 0;min-width:0;height:36px;border-radius:9px;border:1px solid var(--ui-line);background:rgba(255,255,255,.06);color:#cfe0ea;font:600 14px var(--sans);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer;position:relative;padding:0 8px}
.sh-tabs button.on{background:var(--azul-2);border-color:#5f9bc8;color:#fff}
.sh-tabs button.new::after{content:'';position:absolute;top:6px;right:7px;width:8px;height:8px;border-radius:50%;background:#ffd84a;box-shadow:0 0 0 0 rgba(255,216,74,.7);animation:mbping 1.6s ease-out infinite}
@keyframes mbping{to{box-shadow:0 0 0 8px rgba(255,216,74,0)}}
#sheet-h .mb-ic{width:38px;height:36px;font-size:15px;background:rgba(255,255,255,.06)}
#sheet-b{flex:1;min-height:0;position:relative}
#sheet-b>#panel,#sheet-b>#dock{position:absolute;inset:0;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
#sheet[data-tab=texto] #dock,#sheet[data-tab=ctl] #panel{display:none!important}
body.mob #sheet #panel{display:block;height:auto;transform:none;border:0;border-radius:0;box-shadow:none;transition:none}
body.mob #sheet .ph{padding:12px 16px 11px}
body.mob #sheet .ph-close{display:none}
body.mob #sheet .ph h2{font-size:21px;margin-bottom:7px}
body.mob #sheet .seal-ex{font-size:12.5px}
body.mob #sheet .pb{overflow:visible;padding:10px 16px 36px;font-size:16px;line-height:1.55}
body.mob #sheet .box .bt{padding-right:0;margin-top:12px}
body.mob #sheet .ficha dl{grid-template-columns:1fr;gap:1px}
body.mob #sheet .ficha dd{margin-bottom:6px}
body.mob #sheet #dock{width:auto;max-height:none;border:0;border-radius:0;background:#0e1d28;padding:10px 14px 30px;font-size:14px;line-height:1.45}
body.mob .dk-top .btn[data-dk=back],body.mob .dk-min,body.mob .dk-title{display:none}
body.mob .dk-views{margin-bottom:8px}
body.mob .dk-views button,body.mob .dk-ctl .seg button{min-height:42px;font-size:14px}
body.mob .dk-lab{font-size:11.5px}
body.mob .dk-tog{min-height:48px;font-size:14px}
body.mob .dk-row .btn{min-height:44px;font-size:14px}
body.mob .dk-key,body.mob .dk-meter{font-size:13px}
body.mob .dk-info{font-size:14px}
body.mob .dk-info h4{font-size:14.5px}
body.mob .dk-tab{font-size:12.5px}
body.mob .dk-hint{font-size:12.5px;color:#a9bfcd}
body.mob input[type=range]{-webkit-appearance:none;appearance:none;height:36px;background:transparent;margin:0}
body.mob input[type=range]::-webkit-slider-runnable-track{height:6px;border-radius:3px;background:#40525f}
body.mob input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:26px;height:26px;margin-top:-10px;border-radius:50%;background:#ffd84a;border:3px solid #fff;box-shadow:0 1px 5px rgba(0,0,0,.55)}
body.mob input[type=range]::-moz-range-track{height:6px;border-radius:3px;background:#40525f}
body.mob input[type=range]::-moz-range-thumb{width:20px;height:20px;border-radius:50%;background:#ffd84a;border:3px solid #fff}
body.mob #mnav{display:flex;align-items:center;position:fixed;left:0;right:0;bottom:0;height:calc(var(--mn-h) + env(safe-area-inset-bottom));
  padding:0 max(8px,env(safe-area-inset-right)) env(safe-area-inset-bottom) max(8px,env(safe-area-inset-left));gap:8px;z-index:21;background:#07121a;border-top:1px solid var(--ui-line);user-select:none;-webkit-user-select:none}
#mnav .mb-ic{width:54px;height:46px}
body.mob.land #mnav .mb-ic{height:40px}
#mn-step{flex:1;min-width:0;height:46px;border-radius:10px;border:1px solid var(--ui-line);background:var(--ui-bg);color:#e6eef4;text-align:left;padding:2px 10px;line-height:1.2;cursor:pointer;font-family:var(--sans)}

body.mob #modal .card{width:94vw;max-height:84vh;max-height:84dvh;padding:14px 16px 18px}
body.mob .lbl-sc{font-size:12px;padding:2px 7px}

.msteps{display:flex;flex-direction:column;gap:4px;font-family:var(--sans)}
.ms-g{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:#5a7085;font-weight:700;margin:10px 0 2px;padding-bottom:3px;border-bottom:2px solid var(--pc)}

  var b = document.getElementById('boot'); if (!b || b.classList.contains('ok') || b.classList.contains('fail')) return;
  var M = {
    net: 'Não foi possível carregar a biblioteca 3D (Three.js), que a simulação baixa da internet. Verifique a <b>conexão com a internet</b> e recarregue a página (F5).',
    gl: 'Este navegador não conseguiu iniciar o <b>WebGL</b>, necessário para a cena 3D. Tente outro navegador atualizado (Chrome, Edge ou Firefox) ou ative a aceleração por hardware nas configurações dele.',
    err: 'Ocorreu um erro ao montar a simulação. Recarregue a página (F5); se continuar, tente outro navegador atualizado.' };
  b.classList.add('fail'); b.querySelector('p').innerHTML = M[k] || M.err;
};
window.__bootT = setTimeout(function () { window.__bootFail('net'); }, 25000);
window.addEventListener('error', function (e) { if (e && e.message) window.__bootFail('err'); });
</script>

const COL = { steel: 0xc8d0d8, steel2: 0x9eabb7, accent: 0x2b6a99, dark: 0x46535e, brick: 0x7a6a62, pad: 0x3a4853 };
const std = (color, r = .55, m = .15) => new THREE.MeshStandardMaterial({ color, roughness: r, metalness: m });

/* Cada unidade tem seus próprios materiais, para o destaque (hover/foco) não vazar para as outras. */
function unitMats() {
  return {
    steel: std(COL.steel, .42, .35), steel2: std(COL.steel2, .5, .3), accent: std(COL.accent, .6, .1),
    dark: std(COL.dark, .75, .1), brick: std(COL.brick, .85, .05), pad: std(COL.pad, .95, 0),
    glow: new THREE.MeshStandardMaterial({ color: 0x2a0f04, emissive: 0xff6a1f, emissiveIntensity: 1.6, roughness: .8 }),
  };
}
function M(geo, mat, shadow = true) { const o = new THREE.Mesh(geo, mat); o.castShadow = shadow; o.receiveShadow = true; return o; }
function cylG(r, h, seg = 20, rTop = r) { const g = new THREE.CylinderGeometry(rTop, r, h, seg); g.translate(0, h / 2, 0); return g; }
function boxG(w, h, d) { const g = new THREE.BoxGeometry(w, h, d); g.translate(0, h / 2, 0); return g; }
function put(o, x, y, z) { o.position.set(x, y, z); return o; }
function strut(a, b, r, mat) {
  const A = V3(...a), B = V3(...b), len = A.distanceTo(B);
  const m = M(new THREE.CylinderGeometry(r, r, len, 6), mat);
  m.position.copy(A).add(B).multiplyScalar(.5);
  m.quaternion.setFromUnitVectors(V3(0, 1, 0), B.clone().sub(A).normalize());
  return m;
}

/* Caminho com cantos arredondados a partir de uma polilinha. */
function roundedPath(P, rad = .8) {
  const pts = [];
  for (const p of P) if (!pts.length || pts[pts.length - 1].distanceTo(p) > 1e-4) pts.push(p.clone());
  const Q = [pts[0]];
  for (let i = 1; i < pts.length - 1; i++) {
    const a = Q[Q.length - 1], b = pts[i], c = pts[i + 1];
    if (b.clone().sub(a).normalize().dot(c.clone().sub(b).normalize()) < 0.9999) Q.push(b);
  }
  Q.push(pts[pts.length - 1]);
  const path = new THREE.CurvePath();
  let prev = Q[0];
  for (let i = 1; i < Q.length - 1; i++) {
    const a = Q[i - 1], b = Q[i], c = Q[i + 1];
    const r = Math.min(rad, b.distanceTo(a) / 2, c.distanceTo(b) / 2);
    const p1 = b.clone().addScaledVector(a.clone().sub(b).normalize(), r);
    const p2 = b.clone().addScaledVector(c.clone().sub(b).normalize(), r);
    if (prev.distanceTo(p1) > 1e-4) path.add(new THREE.LineCurve3(prev.clone(), p1));
    path.add(new THREE.QuadraticBezierCurve3(p1, b.clone(), p2));
    prev = p2;
  }
  path.add(new THREE.LineCurve3(prev.clone(), Q[Q.length - 1].clone()));
  return path;
}

/* Roteamento ortogonal entre dois bocais: sobe/desce até a altura h, anda em x/z (via), desce no destino.
   Um ponto de "via" pode ser [x,z] ou [x,y,z] (muda a altura a partir dali). */
const PORTS = {};
function port(name, p, d = null, s = 1) { PORTS[name] = { p, d, s }; }
function route(an, bn, o = {}) {
  const a = PORTS[an], b = PORTS[bn];
  if (!a || !b) throw new Error('Bocal inexistente: ' + (!a ? an : bn));
  let h = o.h ?? 2.5;
  const A = V3(...a.p), B = V3(...b.p);
  const A1 = A.clone(); if (a.d) { A1.x += a.d[0] * a.s; A1.z += a.d[1] * a.s; }
  const B1 = B.clone(); if (b.d) { B1.x += b.d[0] * b.s; B1.z += b.d[1] * b.s; }
  const pts = [A]; if (a.d) pts.push(A1); pts.push(V3(A1.x, h, A1.z));
  let cx = A1.x, cz = A1.z;
  const hz = [...(o.via || []), [B1.x, B1.z]];
  for (const v of hz) {
    const nx = v[0], nz = v.length === 3 ? v[2] : v[1];
    if (Math.abs(nx - cx) > 1e-4 && Math.abs(nz - cz) > 1e-4) pts.push((o.order || 'xz') === 'xz' ? V3(nx, h, cz) : V3(cx, h, nz));
    pts.push(V3(nx, h, nz)); cx = nx; cz = nz;
    if (v.length === 3 && v[1] !== h) { h = v[1]; pts.push(V3(cx, h, cz)); }
  }
  pts.push(B1); if (b.d) pts.push(B);
  return pts;
}

/* ---------- construção de unidades ---------- */
const UNITS = {}, PICK = [];
function beginUnit(id, def) {
  const g = new THREE.Group(); g.name = id; world.add(g);
  const u = { id, ...def, g, m: unitMats(), hl: 0, hlApplied: -1, sub: [] };
  UNITS[id] = u; return u;
}
function pad(u, cx, cz, w, d) {
  u.g.add(put(M(boxG(w, PY, d), u.m.pad, false), cx, 0, cz));
  const col = new THREE.Color(SELOS[u.selo]?.cor ?? '#5f7d92');
  const em = new THREE.MeshStandardMaterial({ color: col, emissive: col, emissiveIntensity: .25, roughness: .6 });
  u.sealMat = em;
  const t = .3, h = PY + .06;
  for (const [ox, oz, ww, dd] of [[0, d / 2 - t / 2, w, t], [0, -d / 2 + t / 2, w, t], [w / 2 - t / 2, 0, t, d - 2 * t], [-w / 2 + t / 2, 0, t, d - 2 * t]])
    u.g.add(put(M(boxG(ww, h, dd), em, false), cx + ox, 0, cz + oz));
}
function vesselV(u, x, z, r, h, o = {}) {
  const { y0 = PY, mat = u.m.steel, seg = 20, rings = 0, skirt = true, capSquash = .55 } = o;
  const g = new THREE.Group();
  const sk = skirt ? Math.min(.8, h * .12) : 0;
  if (skirt) g.add(M(cylG(r * .9, sk, seg), u.m.dark));
  g.add(put(M(cylG(r, h - sk, seg), mat), 0, sk, 0));
  const capG = new THREE.SphereGeometry(r, seg, 8, 0, Math.PI * 2, 0, Math.PI / 2); capG.scale(1, capSquash, 1);
  g.add(put(M(capG, mat), 0, h, 0));
  if (rings) for (let y = sk + 2.4; y < h - .6; y += rings) g.add(put(M(cylG(r + .3, .12, seg), u.m.accent), 0, y, 0));
  u.g.add(put(g, x, y0, z)); return g;
}
function vesselH(u, x, z, r, len, o = {}) {
  const { mat = u.m.steel, ay = r + .55 } = o;
  const g = new THREE.Group();
  const body = M(new THREE.CylinderGeometry(r, r, len, 20), mat); body.rotation.z = Math.PI / 2; body.position.y = ay; g.add(body);
  for (const s of [-1, 1]) {
    const cg = new THREE.SphereGeometry(r, 20, 8, 0, Math.PI * 2, 0, Math.PI / 2); cg.scale(1, .5, 1);
    const c = M(cg, mat); c.rotation.z = -s * Math.PI / 2; c.position.set(s * len / 2, ay, 0); g.add(c);
    g.add(put(M(boxG(.45, ay - r * .5, r * 1.4), u.m.dark), s * len * .3, 0, 0));
  }
  u.g.add(put(g, x, PY, z)); return g;
}
function furnace(u, x, z, w, d, h, stacks = 1) {
  const g = new THREE.Group();
  g.add(M(boxG(w, h, d), u.m.brick));
  g.add(put(M(boxG(w + .3, .3, d + .3), u.m.dark), 0, h, 0));
  for (const s of [1, -1]) g.add(put(M(new THREE.BoxGeometry(w * .72, .34, .06), u.m.glow, false), 0, h * .3, s * (d / 2 + .03)));
  for (let i = 0; i < stacks; i++) g.add(put(M(cylG(.3, 4.2, 10), u.m.dark), stacks === 1 ? 0 : -w / 2 + w * (i + .5) / stacks, h + .3, 0));
  u.g.add(put(g, x, PY, z)); return g;
}
function bandMat(color) { const c = new THREE.Color(color); return new THREE.MeshStandardMaterial({ color: c, emissive: c, emissiveIntensity: .18, roughness: .5 }); }
function tank(u, x, z, r, h, color) {
  const g = new THREE.Group();
  g.add(M(cylG(r, h, 24), u.m.steel));
  const roof = new THREE.ConeGeometry(r * 1.02, r * .28, 24); roof.translate(0, h + r * .14, 0); g.add(M(roof, u.m.steel));
  g.add(put(M(cylG(r + .03, .45, 24), bandMat(color)), 0, h * .62, 0));
  u.g.add(put(g, x, PY, z)); return g;
}
function sphereTank(u, x, z, r, color) {
  const g = new THREE.Group(), cy = r + 1.0;
  g.add(put(M(new THREE.SphereGeometry(r, 24, 16), u.m.steel), 0, cy, 0));
  const band = M(new THREE.CylinderGeometry(r * 1.01, r * 1.01, .4, 24, 1, true), bandMat(color)); band.position.y = cy; g.add(band);
  for (let i = 0; i < 6; i++) { const a = i / 6 * Math.PI * 2; g.add(put(M(cylG(.12, cy, 6), u.m.dark), Math.cos(a) * r * .85, 0, Math.sin(a) * r * .85)); }
  u.g.add(put(g, x, PY, z)); return g;
}
function steel(u, pts, r = .15) {
  const c = roundedPath(pts.map((p) => V3(...p)), .5);
  const m = M(new THREE.TubeGeometry(c, Math.max(8, Math.ceil(c.getLength() * 3)), r, 8, false), u.m.steel2);
  u.g.add(m); return m;
}
function endUnit(u) {
  u.g.traverse((o) => { if (o.isMesh) { o.userData.unit = u.id; PICK.push(o); } });
  u.g.updateMatrixWorld(true);
  u.box = new THREE.Box3().setFromObject(u.g);
  const c = u.box.getCenter(V3());
  const at = u.labelAt ? V3(...u.labelAt) : V3(c.x, u.box.max.y + 1.4, c.z);

  u.label = addLabel(`<span class="nm">${u.nome}</span>${s ? `<span class="chip">${s.nome.toUpperCase()}</span>` : ''}`, at,
    { cls: 'lbl-unit', pri: 5, unit: u.id, style: `--sc:${s ? s.cor : '#8fb3c9'}` });
  for (const [txt, p, cls, md] of u.sub)

}

function buildGround() {
  const X0 = -50, X1 = 53, Z0 = -28, Z1 = 28;
  const top = std(0x2b3a45, .95, 0), side = std(0x1b262e, 1, 0);
  const slab = new THREE.Mesh(new THREE.BoxGeometry(X1 - X0, 1.6, Z1 - Z0), [side, side, top, side, side, side]);
  slab.position.set((X0 + X1) / 2, -.8, (Z0 + Z1) / 2); slab.receiveShadow = true; world.add(slab);
  const shadowCatcher = new THREE.Mesh(new THREE.PlaneGeometry(420, 280), new THREE.ShadowMaterial({ opacity: .28 }));

/* Reservatório (Seção 1.4): corte geológico na frente do bloco do campo. */
function buildReservatorio() {
  const u = beginUnit('reservatorio', { nome: 'Reservatório e poço', content: 'petroleo', dica: 'Corte geológico: rocha selante, capa de gás, óleo e água', labelAt: [-68, 4.4, 9.3] });
  const X0 = -80, X1 = -56, Z0 = -10, Z1 = 10, XC = -68;
  const gss = (x) => Math.exp(-(((x - XC) / 6.5) ** 2));
  const rTop = (x) => -6.4 + 3.4 * gss(x), selTop = (x) => rTop(x) + 1.3, rBot = (x) => -9.2 + 2.4 * gss(x), deep = (x) => rBot(x) - 1.1;
  const GOC = -3.8, OWC = -5.4; // contatos gás–óleo e óleo–água (horizontais)
  const band = (top, bot, color) => {
    const n = 160, pts = [];
    for (let i = 0; i <= n; i++) { const x = X0 + (X1 - X0) * i / n, t = top(x), b = bot(x); if (t > b + 1e-3) pts.push([x, t, b]); }
    if (pts.length < 2) return;
    const s = new THREE.Shape(); s.moveTo(pts[0][0], pts[0][1]);
    for (const p of pts) s.lineTo(p[0], p[1]);
    for (let i = pts.length - 1; i >= 0; i--) s.lineTo(pts[i][0], pts[i][2]);
    const g = new THREE.ExtrudeGeometry(s, { depth: Z1 - Z0, bevelEnabled: false, curveSegments: 1 }); g.translate(0, 0, Z0);
    u.g.add(M(g, std(color, .95, 0)));
  };
  band(() => -.15, selTop, 0x8a7658);                                        // sedimentos
  band(selTop, rTop, 0x7d848c);                                              // rocha selante (impermeável)
  band(rTop, () => GOC, 0xe8dd8a);                                           // capa de gás
  band((x) => Math.min(GOC, rTop(x)), (x) => Math.max(OWC, rBot(x)), 0x8e5f34); // óleo
  band((x) => Math.min(OWC, rTop(x)), rBot, 0x5f78cf);                       // água livre
  band(rBot, deep, 0x5c5148);
  band(deep, () => -11, 0x463e37);
  u.g.add(put(M(boxG(X1 - X0, .15, Z1 - Z0), std(0x5d6550, .95, 0)), (X0 + X1) / 2, -.15, 0)); // superfície do campo
  // poço produtor e poço de reinjeção, desenhados sobre o corte
  u.g.add(put(M(cylG(.11, 4.55, 8), u.m.dark), XC, -4.55, Z1 + .08));
  const blue = std(0x3f86f0, .5, .1);
  u.g.add(put(M(cylG(.11, 6.6, 8), blue), -59.5, -6.6, Z1 + .08));
  // cabeça de poço ("árvore de natal")
  const head = (x, mat, s = 1) => {
    const g = new THREE.Group();
    g.add(M(cylG(.45 * s, .25, 12), u.m.dark));
    g.add(put(M(cylG(.2 * s, 1.7 * s, 10), mat), 0, .25, 0));
    g.add(put(M(new THREE.BoxGeometry(1.3 * s, .22, .22), mat), 0, 1.0 * s, 0));
    g.add(put(M(new THREE.SphereGeometry(.24 * s, 10, 8), u.m.steel), 0, 1.95 * s, 0));
    u.g.add(put(g, x, 0, 9.3));
  };
  head(XC, u.m.accent); head(-59.5, blue, .8);
  port('poco.out', [XC - .7, 1.0, 9.3], [-1, 0], .6);
  port('reinj.in', [-59.5 - .55, .8, 9.3], [-1, 0], .7);
  u.sub.push(
    ['rocha selante (impermeável)', [-76, -5.0, Z1 + .3], 'lbl-geo', 75],
    ['capa de gás (CH_{4}, H_{2}S, CO_{2})', [-68, -3.4, Z1 + .3], 'lbl-geo', 75],
    ['óleo (com água emulsionada e gás dissolvido)', [-63, -4.95, Z1 + .3], 'lbl-geo', 75],
    ['água livre (aquífero)', [-60.5, -7.1, Z1 + .3], 'lbl-geo', 75],
    ['poço', [XC + 1.4, 1.0, 9.6]],
    ['reinjeção de água', [-59.5, 2.2, 9.3]],
  );
  endUnit(u);
}

/* =====================================================================
   6. TUBULAÇÕES E FLUXOS (partículas em InstancedMesh, coloridas por fração)
   ===================================================================== */
const FLOWS = [];
function flow(frac, label, from, to, pts, o = {}) {
  const curve = roundedPath(pts.map((p) => (p.isVector3 ? p : V3(...p))), o.rad ?? .8);
  const len = curve.getLength();
  const n = Math.max(12, Math.ceil(len * 2));
  const sp = curve.getSpacedPoints(n);
  const arr = new Float32Array((n + 1) * 3);
  sp.forEach((p, i) => { arr[i * 3] = p.x; arr[i * 3 + 1] = p.y; arr[i * 3 + 2] = p.z; });
  const col = new THREE.Color(FRACOES[frac].cor);
  const mat = new THREE.MeshStandardMaterial({ color: col, emissive: col, emissiveIntensity: .15, transparent: true, opacity: .34, depthWrite: false, roughness: .25, metalness: 0 });
  const tube = new THREE.Mesh(new THREE.TubeGeometry(curve, Math.max(16, Math.ceil(len * 4)), o.r ?? .24, 8, false), mat);
  tube.renderOrder = 2; world.add(tube);
  const f = { frac, label, from, to, curve, len, arr, n, mat, tube, col, count: Math.max(2, Math.round(len / (o.gap ?? 1.5))),
    speed: o.speed ?? 2.6, phase: Math.random(), cube: !!FRACOES[frac].cubo, key: !!o.key, rel: true };
  if (label) {
    const lp = curve.getPointAt(o.lu ?? .5); lp.y += .7;
    f.lbl = addLabel(fmt(label), lp, { cls: 'lbl-flow', pri: o.key ? 2.5 : 2, maxDist: o.maxDist ?? 110, style: `--c:${FRACOES[frac].cor}`, show: () => flowLabelVisible(f) });
  }
  FLOWS.push(f); return f;
}
function flowLabelVisible(f) { if (state.labels !== 'all') return false; return state.focus.size ? f.rel : f.key; }

let PSPH, PCUB;
function buildParticles() {
  let ns = 0, nc = 0;
  for (const f of FLOWS) { if (f.cube) { f.first = nc; nc += f.count; } else { f.first = ns; ns += f.count; } }
  const mat = new THREE.MeshBasicMaterial({ color: 0xffffff }); mat.toneMapped = false;
  PSPH = new THREE.InstancedMesh(new THREE.IcosahedronGeometry(.17, 1), mat, Math.max(1, ns));
  PCUB = new THREE.InstancedMesh(new THREE.BoxGeometry(.3, .3, .3), mat, Math.max(1, nc));
  for (const m of [PSPH, PCUB]) { m.frustumCulled = false; m.renderOrder = 1; world.add(m); }
  for (const f of FLOWS) { f.mesh = f.cube ? PCUB : PSPH; for (let k = 0; k < f.count; k++) f.mesh.setColorAt(f.first + k, f.col); }
  PSPH.instanceColor.needsUpdate = true; PCUB.instanceColor.needsUpdate = true;
}
const _m4 = new THREE.Matrix4();
function updateFlows(dt) {
  for (const f of FLOWS) {
    f.phase = (f.phase + dt * f.speed / f.len) % 1;
    const a = f.arr, n = f.n;
    for (let k = 0; k < f.count; k++) {
      const u = (f.phase + k / f.count) % 1, x = u * n, i = Math.floor(x), t = x - i, j = Math.min(i + 1, n);
      _m4.makeTranslation(a[i * 3] + (a[j * 3] - a[i * 3]) * t, a[i * 3 + 1] + (a[j * 3 + 1] - a[i * 3 + 1]) * t, a[i * 3 + 2] + (a[j * 3 + 2] - a[i * 3 + 2]) * t);
      f.mesh.setMatrixAt(f.first + k, _m4);
    }
  }
  PSPH.instanceMatrix.needsUpdate = true; PCUB.instanceMatrix.needsUpdate = true;
}
const _c = new THREE.Color();
function applyFocus() {
  const any = state.focus.size > 0;
  for (const f of FLOWS) {
    f.rel = !any || state.focus.has(f.from) || state.focus.has(f.to);
    f.mat.opacity = f.rel ? (any ? .5 : .34) : .07;
    f.mat.emissiveIntensity = f.rel ? (any ? .3 : .15) : 0;
    _c.copy(f.col); if (!f.rel) _c.multiplyScalar(.16);
    for (let k = 0; k < f.count; k++) f.mesh.setColorAt(f.first + k, _c);
  }
  PSPH.instanceColor.needsUpdate = true; PCUB.instanceColor.needsUpdate = true;
  for (const u of Object.values(UNITS)) u.label.el.classList.toggle('focus', state.focus.has(u.id));
}

   ===================================================================== */
const LABELS = [];
const labelLayer = $('#labels');
function addLabel(html, pos, o = {}) {
  const el = document.createElement('div');
  el.className = 'lbl off ' + (o.cls || '');
  el.innerHTML = html;
  if (o.style) el.style.cssText += o.style;
  labelLayer.appendChild(el);
  const L = { el, pos, mid: o.mid ?? (o.cls || '').includes('lbl-geo'), side: o.side || null, pri: o.pri ?? 1, show: o.show || null, maxDist: o.maxDist ?? Infinity,
    w: 0, h: 0, unit: o.unit || null, area: !!o.area, key: !!o.key, scene: o.scene || null, below: !!o.below, on: false };
  if (o.unit) {
    el.addEventListener('click', (e) => { e.stopPropagation(); openUnit(o.unit); });
    el.addEventListener('pointerenter', () => setHover(o.unit));
    el.addEventListener('pointerleave', () => setHover(null));
  }

function formState(s, i, d) {

function updFormacao(s, dt, dtr) {

    if (s.s >= 1) { s.playing = false; renderDockBody(); }
    const r = dockEl.querySelector('input[data-ctl="s"]'); if (r) r.value = Math.round(s.s * 100);

function buildMigracao(s) {

/* Uma porção nasce na zona de flash: vapor sobe até o prato da sua faixa; líquido (e parte dos leves) desce. */
function atmSpawn(s, i) {
  const f = pickMix(ATM_MIX, Math.random());
  s.af[i] = f; s.aLev[i] = 0; s.aMis[i] = 0; s.ad[i] = Math.random() * 6.28;
  s.ax[i] = -1.9 + Math.random() * 1.1; s.ay[i] = ATM_FLASH + (Math.random() - .5) * .5; s.az[i] = -.35 - Math.random() * 1.4;
  if (f === 'residuo') { s.aph[i] = 3; }
  else if (Math.random() < .16) { s.aph[i] = 3; s.aLev[i] = 1; }  // leves arrastados pelo líquido que desce
  else atmVapor(s, i);
  s.aI.setColorAt(i, _c3.set(FC[f]));
}
function atmVapor(s, i) {
  const f = s.af[i]; s.aph[i] = 1;
  let ty = ATM_ALT[f];
  if (!s.refl && ATM_MAIS_LEVE[f] && Math.random() < .35) { ty = ATM_ALT[ATM_MAIS_LEVE[f]]; s.aMis[i] = 1; }  // sem refluxo, pesados sobem demais
  s.aty[i] = ty;
}
/* Ao mudar refluxo ou vapor, as porções em trânsito já obedecem à nova condição (o medidor responde logo). */
function atmRetarget(s) {
  if (!s.aph) return;
  for (let i = 0; i < s.aN; i++) {
    const f = s.af[i];
    if (s.aph[i] === 1 && s.ay[i] < ATM_ALT[f]) {
      s.aMis[i] = 0;
      if (s.ay[i] < s.aty[i] || !s.refl) atmVapor(s, i);
    } else if (s.aph[i] === 4 && s.aLev[i] && s.vap) { s.ay[i] = 2.9; atmVapor(s, i); }
  }
}
function atmStep(s, i, dt) {
  const { R } = ATM, ph = s.aph[i], lim = R - .45;
  if (ph === 1) { // vapor subindo
    s.ay[i] += (1.5 + .25 * Math.sin(s.ad[i] * 3)) * dt;
    s.ax[i] = clamp(s.ax[i] + Math.sin(sim.t * 1.7 + s.ad[i]) * .5 * dt, -lim, lim);
    if (s.ay[i] >= Math.min(s.aty[i], ATM_TOPO)) {
      if (s.aty[i] > ATM_TOPO) return atmSpawn(s, i);  // saiu pelo topo
      const p = ATM_PRATOS.reduce((a, y) => (Math.abs(y - s.aty[i]) < Math.abs(a - s.aty[i]) ? y : a), ATM_PRATOS[0]);
      s.aph[i] = 2; s.ay[i] = p + .22;
    }
  } else if (ph === 2) { // líquido saindo pela retirada lateral
    s.ax[i] += 1.2 * dt;
    if (s.ax[i] > lim) return atmSpawn(s, i);
  } else if (ph === 3) { // líquido descendo de prato em prato
    s.ay[i] -= 1.3 * dt;
    const k = Math.floor((s.ay[i] - 3.6) / 1.85), side = (k % 2 ? -1 : 1) * 1.1;
    s.ax[i] += (side - s.ax[i]) * Math.min(1, dt * 1.5);
    if (s.ay[i] < 2.7) {
      if (s.aLev[i] && s.vap) { s.ay[i] = 2.9; atmVapor(s, i); }  // o vapor d'água revaporiza os leves
      else { s.aph[i] = 4; s.ay[i] = 2.15; }
    }
  } else if (ph === 4) { // fundo: segue para a saída do RAT
    s.ax[i] += .9 * dt;
    if (s.ax[i] > lim) return atmSpawn(s, i);
  }
}
function updTorreAtm(s, dt) {
  const t = sim.t;
  for (const f of s.pipes) updatePipe(f, dt);
  updatePipe(s.fRefl, dt); updatePipe(s.fVap, dt);
  flickerFlames(s.forno, t);
  let nCut = 0, nMis = 0, nDesce = 0, nLev = 0;
  for (let i = 0; i < s.aN; i++) {
    if (dt > 0) atmStep(s, i, dt);
    const ph = s.aph[i];
    place(s.aI, i, s.ax[i], s.ay[i], s.az[i], ph === 1 ? .11 : .14, ph === 1 ? .11 : .1);
    if ((ph === 1 || ph === 2) && ATM_MAIS_LEVE[s.af[i]]) { nCut++; nMis += s.aMis[i]; }
    else if (ph === 3 || ph === 4) { nDesce++; if (s.aLev[i] && (!s.vap || ph === 4)) nLev++; }
  }
  flush(s.aI);
  // medidores: fração das porções a caminho de um corte que vai sair misturado; leves que vão acabar no RAT
  const kE = 1 - Math.exp(-dt / .5);
  s.mixA += ((nCut ? nMis / nCut : 0) - s.mixA) * kE;
  s.lossA += ((nDesce ? nLev / nDesce : 0) - s.lossA) * kE;
  for (let i = 0; i < 26; i++) {
    if (!s.refl) { s.rI.setMatrixAt(i, ZERO); continue; }
    s.ry[i] -= 1.1 * dt; if (s.ry[i] < 17.8) { s.ry[i] = 21; s.rx[i] = .2 + Math.random() * 1.6; }
    place(s.rI, i, s.rx[i], s.ry[i], s.rz[i], .1 * Math.min(1, (s.ry[i] - 17.8) / 1.2));
  }
  flush(s.rI);
  for (let i = 0; i < 30; i++) {
    if (!s.vap) { s.vI.setMatrixAt(i, ZERO); continue; }
    s.vt[i] += dt * .5; if (s.vt[i] > 1) s.vt[i] -= 1;
    const u = s.vt[i], x = 1.8 - u * 3.2 + Math.sin(i * 1.7) * .4, y = 3.0 + u * 3.6, z = -.4 - (i % 5) * .3;
    place(s.vI, i, x, y, z, .09 * Math.sin(Math.PI * u) + .02);
  }
  flush(s.vI);
}

/* ---------- aba 1: torre de extração em contracorrente ---------- */
function buildExtracao(s) {
  const g = new THREE.Group(); s.g.add(g); s.vg.ext = g;
  const { R, y0, H, Z } = DES, V = () => s.view === 'ext', wall = R - .25, Zt = -.7, xL = -7.4, xR = 7.4;
  const top = y0 + H + R * .45; s.eY = { rv: 12.4, sv: 3.0, top: y0 + H + .2, bot: 2.4, wall };
  g.add(put(sm(new THREE.BoxGeometry(19, .2, 8), smat(0x2b3a45, { roughness: .95 })), 0, -.1, -1.5));
  const gT = pickGrp(s, g, 'torre', DES_PARTES.torre.n, DES_PARTES.torre.d);
  cutTower(gT, R, y0, H, 0);
  towerGradient(gT, R, y0, H, 0, COR_CARGA, COR_SOLV, .2);
  const pipes = s.ePipes = [];
  const gRv = pickGrp(s, g, 'rv', DES_PARTES.rv.n, DES_PARTES.rv.d);
  pipes.push(pipeFlow(gRv, [[xL, s.eY.rv, Z], [.8, s.eY.rv, Z]], { pick: () => FC.residuo }));
  const gS = pickGrp(s, g, 'solvente', DES_PARTES.solvente.n, DES_PARTES.solvente.d);
  pipes.push(pipeFlow(gS, [[xL, s.eY.sv, Z], [.8, s.eY.sv, Z]], { pick: () => COR_SOLV }));
  const gE = pickGrp(s, g, 'extrato', DES_PARTES.extrato.n, DES_PARTES.extrato.d);
  pipes.push(pipeFlow(gE, [[0, top - .2, Zt], [0, top + 1.0, Zt], [xR, top + 1.0, Zt]],
    { pick: () => (Math.random() < .175 ? (Math.random() < .5 * Math.pow(s.sg, 1.3) ? COR_ASF : COR_ODES) : COR_SOLV) }));
  const gRa = pickGrp(s, g, 'rafinado', DES_PARTES.rafinado.n, DES_PARTES.rafinado.d);
  pipes.push(pipeFlow(gRa, [[wall, 2.0, Z], [xR, 2.0, Z]], { pick: () => (Math.random() < .5 ? COR_ASF : COR_SOLV) }));
  // gotas de RV, solvente e óleo dissolvido
  s.dN = 44; s.dI = swarm(g, s.dN, SPH);
  for (const k of ['dx', 'dy', 'dz', 'dO', 'dA', 'dW', 'deO', 'deA']) s[k] = new Float32Array(s.dN);
  s.sN = 90; s.sI = swarm(g, s.sN, SPH_LO);
  for (const k of ['svx', 'svy', 'svz', 'svw']) s[k] = new Float32Array(s.sN);
  s.oN = 140; s.oI = swarm(g, s.oN, SPH_LO); s.oNext = 0;
  for (const k of ['ox', 'oy', 'oz', 'oOn']) s[k] = new Float32Array(s.oN);
  for (let i = 0; i < s.dN; i++) extDrop(s, i, true);
  for (let i = 0; i < s.sN; i++) extSolv(s, i, true);
  // rótulos
  const lb = (t, p, o = {}) => sceneLabel(s, t, V3(...p), { pri: 5, ...o, show: o.show ? () => V() && o.show() : V });
  lb('<b>resíduo de vácuo (RV)</b><small>mais denso: entra no topo e desce</small>', [-5.0, s.eY.rv + .3, Z], { key: true, pri: 7, style: `--c:${FRACOES.residuo.cor}` });
  s.lbSolvE = lb('<b>solvente: propano</b><small>entra no fundo e sobe</small>', [-5.0, s.eY.sv - .3, Z], { below: true, key: true, pri: 7, style: `--c:${hex(COR_SOLV)}` });
  lb('<b>extrato</b><small>15–20% de óleo + 80–85% de solvente</small>', [xR + .2, top + 1.0, Zt], { side: 'r', key: true, pri: 7, cls: 'lbl-sc wrap', style: `--c:${hex(COR_CARGA)};max-width:170px` });
  lb('<b>rafinado</b><small>emulsão do material asfáltico no solvente</small>', [xR + .2, 2.0, Z], { side: 'r', key: true, pri: 7, cls: 'lbl-sc wrap', style: `--c:${hex(COR_ASF)};max-width:170px` });
  lb('o óleo passa do RV<br>para o solvente', [R + .35, 9.4, -.4], { side: 'r', cls: 'lbl-eq', pri: 5 });
  lb('contracorrente', [-R - .35, 7.6, -.4], { side: 'l', cls: 'lbl-eq', pri: 5 });
}
function extDrop(s, i, scatter) {
  const Y = s.eY;
  s.dx[i] = -1.5 + Math.random() * 3; s.dz[i] = -.4 - Math.random() * 1.4; s.dW[i] = Math.random() * 6.28; s.deO[i] = s.deA[i] = 0;
  s.dy[i] = scatter ? lerp(Y.bot, Y.rv - .2, Math.random()) : Y.rv - .2;
  const f = scatter ? (s.dy[i] - Y.bot) / (Y.rv - Y.bot) : 1;
  s.dO[i] = .15 + .85 * f; s.dA[i] = 1;
}
function extSolv(s, i, scatter) {
  const Y = s.eY;
  s.svx[i] = -1.6 + Math.random() * 3.2; s.svz[i] = -.3 - Math.random() * 1.6; s.svw[i] = Math.random() * 6.28;
  s.svy[i] = scatter ? lerp(Y.sv, Y.top, Math.random()) : Y.sv + .1;
}
function extEmit(s, x, y, z, c) {
  const k = s.oNext++ % s.oN;
  s.ox[k] = x; s.oy[k] = y; s.oz[k] = z; s.oOn[k] = 1; s.oI.setColorAt(k, _c3.setHex(c));
}
function updExtracao(s, dt) {
  for (const f of s.ePipes) updatePipe(f, dt);
  const Y = s.eY, lim = DES.R - .5, sg = s.sg, kO = .14 + .2 * sg, kA = .16 * Math.pow(sg, 1.3), t = sim.t;
  for (let i = 0; i < s.dN; i++) {
    if (dt > 0) {
      if (s.dy[i] > Y.bot) {
        s.dy[i] -= (.7 + .15 * Math.sin(s.dW[i] * 3)) * dt;
        s.dx[i] = clamp(s.dx[i] + Math.sin(t * 1.3 + s.dW[i]) * .3 * dt, -lim, lim);
        const c = clamp((s.dy[i] - Y.sv) / (Y.rv - Y.sv), 0, 1);           // carga de óleo do solvente nesta altura
        const dO = kO * Math.max(0, s.dO[i] - .45 * c) * dt, dA = kA * s.dA[i] * dt;
        s.dO[i] -= dO; s.dA[i] -= dA; s.deO[i] += dO; s.deA[i] += dA;

/* Põe a molécula no instante t (fade multiplica o tamanho de tudo); jit(M) pode mexer nas posições antes das ligações. */

  for (const a of M.A) { a.pos.lerpVectors(a.P[k], a.P[k + 1], u); a.pr = lerp(a.on[k], a.on[k + 1], u) * fade; }

    a.mesh.visible = a.pr > .01;
    if (!a.mesh.visible) continue;
    a.mesh.position.copy(a.pos); a.mesh.scale.setScalar(a.rad * a.pr);
    if (a.C) { a.mat.color.setHex(a.C[k]).lerp(_maC.setHex(a.C[k + 1]), u); if (a.glow) a.mat.emissive.copy(a.mat.color); }

    const A = M.A[b.a], Bb = M.A[b.b], pr = Math.min(A.pr, Bb.pr);

    if (!b.s1.visible) continue;

    b.s1.position.copy(_maM).addScaledVector(_maP, -off); b.s1.quaternion.copy(_maQ); b.s1.scale.set(M.w, len * o1, M.w);
    if (b.s2.visible) { b.s2.position.copy(_maM).addScaledVector(_maP, off); b.s2.quaternion.copy(_maQ); b.s2.scale.set(M.w * o2, len, M.w * o2); }

      const h = lerp(b.hot[k], b.hot[k + 1], u) * (.75 + .25 * Math.sin(sim.t * 9));
      b.m.color.setHex(COR_LIG).lerp(_maC.setHex(COR_QUEBRA), h); b.m.emissive.setHex(COR_QUEBRA).multiplyScalar(h * .7);

/* Posição do átomo i da molécula M em coordenadas do mundo (os grupos da cena não se movem depois de montados). */
const molWorld = (M, i, out) => out.copy(M.A[i].pos).applyMatrix4(M.g.matrixWorld);

/* Reação com todos os H: reagente R e produto P montados com molNew/mA/mB/mH, com os C primeiro e na mesma ordem.
   Os H de cada C são casados em ordem; os que sobram em R saem aos pares como H2 (desidrogenação); os que faltam
   em R chegam de um H2 (hidrocraqueamento) ou, com o.transfer, passam de um C para outro (isomerização).
   Quadros: [reagente, reagente, produto, produto com o H2 afastado]. o.lift: componente mínima para cima do H2. */
function rxnDef(R, P, o = {}) {
  const nC = R.a.filter((a) => a[0] !== 'H').length;
  const hOf = (m) => { const L = Array.from({ length: nC }, () => []); for (const [i, j] of m.b) { if (m.a[i][0] === 'H' && j < nC) L[j].push(i); else if (m.a[j][0] === 'H' && i < nC) L[i].push(j); } return L; };

  const cen = V3(); for (let i = 0; i < nC; i++) cen.add(R.a[i][1]); cen.divideScalar(nC);
  for (let i = 0; i < nC; i++) at.push({ el: R.a[i][0], P: [R.a[i][1], R.a[i][1], P.a[i][1], P.a[i][1]] });
  const cc = new Map(), key = (i, j) => (i < j ? i + '-' + j : j + '-' + i);
  for (const [i, j, ord] of R.b) if (i < nC && j < nC) cc.set(key(i, j), { a: i, b: j, o: [ord, ord, 0, 0] });
  for (const [i, j, ord] of P.b) if (i < nC && j < nC) { const e = cc.get(key(i, j)) || { a: i, b: j, o: [0, 0, 0, 0] }; e.o[2] = e.o[3] = ord; cc.set(key(i, j), e); }
  for (const e of cc.values()) { if (e.o[1] && !e.o[2]) e.hot = [0, 1, 0, 0]; bd.push(e); }
  const leave = [], arrive = [];
  for (let c = 0; c < nC; c++) {
    const a = HR[c], b = HP[c], n = Math.min(a.length, b.length);
    for (let k = 0; k < n; k++) { const id = at.push({ el: 'H', P: [R.a[a[k]][1], R.a[a[k]][1], P.a[b[k]][1], P.a[b[k]][1]] }) - 1; bd.push({ a: c, b: id, o: [1, 1, 1, 1] }); }
    for (let k = n; k < a.length; k++) leave.push([c, R.a[a[k]][1]]);
    for (let k = n; k < b.length; k++) arrive.push([c, P.a[b[k]][1]]);
  }

  if (o.transfer) {
    leave.forEach(([c1, p1], k) => { const [c2, p2] = arrive[k]; const id = at.push({ el: 'H', P: [p1, p1, p2, p2] }) - 1; bd.push({ a: c1, b: id, o: [1, 1, 0, 0] }, { a: c2, b: id, o: [0, 0, 1, 1] }); });
  } else {
    for (let k = 0; k + 1 < leave.length; k += 2) {        // H2 que sai
      const [c1, p1] = leave[k], [c2, p2] = leave[k + 1], mid = p1.clone().add(p2).multiplyScalar(.5), d = outDir(mid);
      const c0 = mid.clone().addScaledVector(d, o.h2Out ?? 1.5), c3 = c0.clone().addScaledVector(d, 2.2).add(V3(0, 1.4, 0));
      const ax = p2.clone().sub(p1).normalize().multiplyScalar(.37);
      const h1 = at.push({ el: 'H', P: [p1, p1, c0.clone().sub(ax), c3.clone().sub(ax)] }) - 1, h2 = at.push({ el: 'H', P: [p2, p2, c0.clone().add(ax), c3.clone().add(ax)] }) - 1;
      bd.push({ a: c1, b: h1, o: [1, 1, 0, 0] }, { a: c2, b: h2, o: [1, 1, 0, 0] }, { a: h1, b: h2, o: [0, 0, 1, 1] });
    }
    for (let k = 0; k + 1 < arrive.length; k += 2) {       // H2 que chega
      const [c1, p1] = arrive[k], [c2, p2] = arrive[k + 1], mid = p1.clone().add(p2).multiplyScalar(.5), d = outDir(mid);
      const c1p = mid.clone().addScaledVector(d, 2.0).add(V3(0, 1.0, 0)), c0 = c1p.clone().addScaledVector(d, 2.4).add(V3(0, 1.2, 0)), ax = V3(.37, 0, 0);
      const h1 = at.push({ el: 'H', P: [c0.clone().sub(ax), c1p.clone().sub(ax), p1, p1] }) - 1, h2 = at.push({ el: 'H', P: [c0.clone().add(ax), c1p.clone().add(ax), p2, p2] }) - 1;
      bd.push({ a: h1, b: h2, o: [1, 1, 0, 0] }, { a: c1, b: h1, o: [0, 0, 1, 1] }, { a: c2, b: h2, o: [0, 0, 1, 1] });
    }
  }
  return { at, bd, T: o.T || [0, 2.8, 6.8, 10.2], nC, nH2out: o.transfer ? 0 : leave.length >> 1, nH2in: o.transfer ? 0 : arrive.length >> 1 };
}

/* Caminho para partículas: curva com cantos arredondados, amostrada para avaliar rápido. */

const _fccP = new THREE.Vector3();
function updFccLoop(s, dt, warm) {
  const RS = FCC_RS, SP = FCC_SP, RG = FCC_RG, A = FCC_AR[s.ar], t = sim.t;
  if (!warm) for (const f of s.lPipes) updatePipe(f, dt);
  let nE = 0, sA = 0, sC = 0, sH = 0, nB = 0, sQ = 0;
  for (let i = 0; i < FCC_N; i++) {
    if (s.cd[i] > 0) { s.cd[i] -= dt; s.cI.setMatrixAt(i, ZERO); continue; }
    const st = s.cst[i];
    if (st === 0) {                                  // riser: sobe com os vapores; coque e queda de temperatura
      s.cy[i] += (3.2 + 1.0 * s.cw[i]) * dt;
      const pr = clamp((s.cy[i] - RS.y0) / (RS.y1 - RS.y0), 0, 1);
      s.cx[i] = RS.x + s.cjx[i] * (RS.r - .12); s.cz[i] = s.cjz[i] * (RS.r - .12);
      s.cc[i] = s.cci[i] + (1 - s.cci[i]) * .92 * s.ca[i] * pr;
      s.ch[i] = s.chi[i] * (1 - .6 * s.ca[i] * pr);
      if (pr < .3) { nE++; sA += s.ca[i]; sC += 1 - s.cci[i]; sH += s.chi[i]; }
      if (pr >= 1) { s.cst[i] = 1; s.cvx[i] = (Math.random() - .5) * 2.6; s.cvy[i] = .6 + Math.random() * 1.4; s.cvz[i] = -Math.random() * 1.3; }
    } else if (st === 1) {                           // vaso separador: o catalisador cai; os vapores seguem
      s.cvy[i] -= 7 * dt;
      s.cx[i] += s.cvx[i] * dt; s.cy[i] += s.cvy[i] * dt; s.cz[i] += s.cvz[i] * dt;
      const dx = s.cx[i] - SP.x, dz = s.cz[i], rr = Math.hypot(dx, dz), lim = SP.R - .3;
      if (rr > lim) { s.cx[i] = SP.x + dx / rr * lim; s.cz[i] = dz / rr * lim; s.cvx[i] *= -.3; s.cvz[i] *= -.3; }
      if (s.cz[i] > -.05) { s.cz[i] = -.05; s.cvz[i] = -Math.abs(s.cvz[i]) * .5; }
      if (s.cy[i] < SP.y0 - .25) { s.cst[i] = 2; s.cu[i] = 0; s.cS0[i].set(s.cx[i], s.cy[i], s.cz[i]); }
    } else if (st === 2 || st === 5) {               // escoa até a saída do vaso
      s.cu[i] = Math.min(1, s.cu[i] + dt / (st === 2 ? .45 : .6));
      _fccP.lerpVectors(s.cS0[i], (st === 2 ? s.pSp : s.pRg).S[0], ease(s.cu[i]));
      s.cx[i] = _fccP.x; s.cy[i] = _fccP.y; s.cz[i] = _fccP.z;
      if (s.cu[i] >= 1) { s.cst[i] = st + 1; s.cu[i] = 0; }
    } else if (st === 3 || st === 6) {               // linhas de catalisador gasto e regenerado
      const P = st === 3 ? s.pSp : s.pRg;
      s.cu[i] += dt * (st === 3 ? 2.0 : 2.4) / P.len;
      pathAt(P, s.cu[i], _fccP);
      s.cx[i] = _fccP.x + s.cjx[i] * .16; s.cy[i] = _fccP.y + (s.cw[i] - .5) * .3; s.cz[i] = _fccP.z + s.cjz[i] * .16;
      if (s.cu[i] >= 1) {
        if (st === 3) { s.cst[i] = 4; s.ctb[i] = 3.4 + 2.2 * Math.random(); s.cS0[i].set(RG.x + s.cjx[i] * (RG.R - .55), lerp(RG.b0 + .35, RG.b1 - .35, Math.random()), -Math.abs(s.cjz[i]) * (RG.R - .7) - .15); }
        else { s.cst[i] = 0; s.cy[i] = RS.y0; s.cci[i] = s.cc[i]; s.chi[i] = s.ch[i]; s.ca[i] = (1 - s.cci[i]) * sstep(.25, .7, s.chi[i]); }
      }
    } else {                                         // 4: leito fluidizado do regenerador: o ar queima o coque
      s.ctb[i] -= dt;
      const ph = s.cw[i] * 6.283;
      s.cx[i] = s.cS0[i].x + Math.sin(t * 1.3 + ph) * .35; s.cy[i] = s.cS0[i].y + Math.sin(t * 2.1 + ph * 1.7) * .4; s.cz[i] = Math.min(-.1, s.cS0[i].z + Math.cos(t * 1.1 + ph) * .3);
      const q = A.k * Math.max(0, s.cc[i] - A.piso);
      s.cc[i] -= q * dt;
      s.ch[i] = A.k ? Math.min(1, s.ch[i] + (q * 1.8 + .12) * dt) : s.ch[i] - (s.ch[i] - .12) * .25 * dt;
      nB++; sQ += q;
      if (s.ctb[i] <= 0) { s.cst[i] = 5; s.cu[i] = 0; s.cS0[i].set(s.cx[i], s.cy[i], s.cz[i]); }
    }
    _c3.setHex(COR_CAT).lerp(_c4.setHex(COR_CAT_Q), clamp(s.ch[i], 0, 1) ** 1.5).lerp(_c4.setHex(COR_CAT_K), clamp(s.cc[i], 0, 1) * .9);
    s.cI.setColorAt(i, _c3);
    place(s.cI, i, s.cx[i], s.cy[i], s.cz[i], .1);
  }
  flush(s.cI);
  const kE = 1 - Math.exp(-dt / .6);
  if (nE) { s.actE += (sC / nE - s.actE) * kE; s.heatE += (sH / nE - s.heatE) * kE; s.convE += (sA / nE - s.convE) * kE; }
  s.burnE += ((nB ? sQ / nB : 0) - s.burnE) * kE;
  if (warm) return;
  // vapores no riser: o GOV (lilás) vira produtos à medida que sobe, conforme a atividade do catalisador
  for (let i = 0; i < FCC_NV; i++) {
    s.vy[i] += 4.4 * dt;
    if (s.vy[i] > RS.y1) { s.vy[i] = RS.y0; s.vcv[i] = Math.random() < s.convE ? 1 : 0; s.vcol[i] = s.vcv[i] ? FC[pickMix(FCC_PROD, Math.random())] : FC.gasoleo; }
    const pr = (s.vy[i] - RS.y0) / (RS.y1 - RS.y0);
    s.vI.setColorAt(i, _c3.setHex(FC.gasoleo).lerp(_c4.setHex(s.vcol[i]), sstep(.05, .6, pr)));
    place(s.vI, i, RS.x + s.vjx[i] * (RS.r - .1), s.vy[i], s.vjz[i] * (RS.r - .1), .075);
  }
  flush(s.vI);
  s.bedM.emissiveIntensity = clamp(.1 + 2.2 * s.burnE, .1, 1.1);
  flickerFlames(s.fPre, t, 1);
  flickerFlames(s.fCb, t, A.ch);
  s.fCb.flames.forEach((f) => { f.visible = A.ch > .02; });
  s.fAr.on = s.fGas.on = s.ar !== 'sem'; s.fVap.on = A.ch > 0;
  s.fTop.on = s.fLco.on = s.fOd.on = s.convE > .2;
}

/* ---------- aba 2: o carbocátion sobre a zeólita (Seção 10.4) ---------- */
const FCC_MT = 20.3, FCC_MS = .6;
function buildFccMol(s) {
  const g = new THREE.Group(); s.g.add(g); s.vg.mol = g;
  const V = () => s.view === 'mol', w = new THREE.Group(); w.scale.setScalar(FCC_MS); g.add(w);
  const Z = zeoSlab(w, -.9, [3.1, 0]), site = Z.siteO.clone().add(V3(0, .95, 0));
  // oct-1-eno: C0..C3 = R; C4 = CH2 (β); C5 = CH2 (α); C6 = CH (vira C⁺); C7 = CH2 terminal
  const base = Array.from({ length: 8 }, (_, i) => V3((i - 3.5) * 1.27 + .2, 1.9 + (i % 2 ? .44 : -.44), 0));
  const off = (p, x, y, z = 0) => p.clone().add(V3(x, y, z));
  const iso = [base[0], base[1], base[2], base[3], V3(-1.855, .71, 1.15)].map((p, i) => (i < 4 ? off(p, -.5, 0) : p));
  const T = [0, 2.0, 3.4, 5.2, 6.8, 8.6, 10.6, 12.2, 13.6, 15.0, 16.6, 18.8, 19.8];
  const nK = T.length, at = [], G = ATOM.C[0], GOLD = 0xffc23a;
  // posições por quadro: R (C0..C4) e propeno (C5..C7 + H)
  for (let i = 0; i < 8; i++) {
    const P = [], C = [];
    for (let k = 0; k < nK; k++) {
      let p = base[i].clone();
      if (k === 0) p = off(p, -2.2, 1.8);
      else if (i <= 4) { if (k >= 4) p = off(p, -.5, 0); if (k >= 7) p = iso[i].clone(); if (k >= 10) p = off(k >= 7 ? iso[i] : p, -.9, 1.5, 0); }
      else { if (k === 4) p = off(p, .9, .7); else if (k >= 5) p = off(p, 2.0, 2.2, .6); }
      P.push(p);
      C.push((i === 6 && k >= 2 && k <= 3) || (i === 4 && k >= 4 && k <= 6) || (i === 2 && k >= 7 && k <= 8) ? GOLD : G);
    }
    at.push({ el: 'C', P, c: C, r: .42 });
  }
  const hp1 = at.push({ el: 'H+', P: T.map((_, k) => (k <= 1 ? site : k <= 3 ? off(at[7].P[k], .5, -.85) : off(at[7].P[k], .5, -.85))),
    c: T.map((_, k) => (k <= 3 ? COR_HP : ATOM.H[0])), r: .3 }) - 1;
  const hp2 = at.push({ el: 'H+', P: T.map((_, k) => (k < 9 ? null : k === 9 ? off(at[1].P[9], -.25, -.95) : site)), r: .3 }) - 1;
  const bd = [];
  const ord = (fn) => T.map((_, k) => fn(k));
  for (let i = 0; i < 7; i++) {
    let O;
    if (i === 6) O = ord((k) => (k <= 1 ? 2 : 1));             // C6=C7 vira C6–C7 ao receber o H⁺
    else if (i === 5) O = ord((k) => (k >= 4 ? 2 : 1));                          // C5=C6: propeno
    else if (i === 4) O = ord((k) => (k >= 4 ? 0 : 1));                          // ligação β: rompe
    else if (i === 3) O = ord((k) => (k >= 7 ? 0 : 1));                          // rearranjo: C4 passa para C2
    else if (i === 1) O = ord((k) => (k >= 9 ? 2 : 1));                          // olefina ramificada no fim
    else O = ord(() => 1);
    bd.push({ a: i, b: i + 1, o: O, hot: i === 4 ? ord((k) => (k === 3 ? 1 : 0)) : null });
  }
  bd.push({ a: 2, b: 4, o: ord((k) => (k >= 7 ? 1 : 0)) });
  bd.push({ a: 7, b: hp1, o: ord((k) => (k >= 2 ? 1 : 0)) });
  bd.push({ a: 1, b: hp2, o: ord((k) => (k === 9 ? 1 : 0)) });
  s.fm = molAnim(w, { at, bd, T }, { w: 1.15 });
  // rótulos que acompanham os átomos
  const lb = (t, o = {}) => sceneLabel(s, t, V3(), { pri: 6, key: true, ...o, show: o.show ? () => V() && o.show() : V });
  const tin = (a, b) => () => s.mt >= a && s.mt < b;
  lb('<b>sítio ácido (H⁺)</b><small>Al³⁺ no lugar de Si⁴⁺ na rede</small>', { side: 'r', style: `--c:${hex(COR_HP)}`, pri: 7 }).pos.copy(Z.siteO).multiplyScalar(FCC_MS).add(V3(.5, 0, 0));
  sceneLabel(s, 'zeólita', V3(-4.4, -1.15, 0), { cls: 'lbl-eq', pri: 4, show: V });
  s.fL = [
    [lb('<b>olefina</b><small>recebe o H⁺ do catalisador</small>', { show: tin(.3, 3.6) }), () => 3, [0, .9, 0]],
    [lb('<b>C⁺</b>', { style: `--c:#ffc23a`, show: tin(3.4, 15.0), pri: 8 }), () => (s.mt < 6.8 ? 6 : s.mt < 12.2 ? 4 : 2), [0, .55, 0]],
    [lb('<b>cisão β</b><small>rompe a ligação em β ao C⁺</small>', { below: true, style: '--c:#ff7a5c', show: tin(4.4, 7.4), pri: 7 }), () => 4, [.4, -.45, 0]],
    [lb('<b>propeno (C3)</b><small>→ GLP</small>', { style: `--c:${FRACOES.glp.cor}`, show: tin(7.4, 19.6) }), () => 6, [0, .6, 0]],
    [lb('<b>rearranjo</b><small>forma ramificada</small>', { side: 'l', show: tin(10.8, 14.8) }), () => 1, [-.3, 0, 0]],
    [lb('<b>o H⁺ volta ao catalisador</b>', { side: 'r', style: `--c:${hex(COR_HP)}`, show: tin(15.0, 17.4) }), () => hp2, [.3, 0, 0]],
    [lb('<b>olefina ramificada (C5)</b><small>→ nafta de boa octanagem</small>', { side: 'l', style: `--c:${FRACOES.nafta.cor}`, show: tin(16.8, 19.6) }), () => 0, [-.3, 0, 0]],
  ];
  g.updateMatrixWorld(true); s.mt = 0; updFccMol(s, 0);
}
function updFccMol(s, dt) {
  s.mt += dt; if (s.mt > FCC_MT) s.mt = 0;
  const t = s.mt, fade = sstep(0, .6, t) * (1 - sstep(19.0, 19.9, t));
  molAnimSet(s.fm, t, fade);
  for (const [L, at, o] of s.fL) molWorld(s.fm, at(), L.pos).add(_fccP.set(...o));
}

/* Fase do tambor i no ciclo: o ativo enche; o outro passa por resfriamento, descoqueamento, reaquecimento e espera. */
function coqFase(s, i) {
  if (i === s.act) return { f: 'enchendo', u: s.cyc / COQ_T, lv: .03 + (COQ_LV - .03) * (s.cyc / COQ_T) };
  let t = s.cyc;
  for (const [f, d] of COQ_FASES) {
    if (t < d) { const u = t / d; return { f, u, lv: f === 'resfriamento' ? COQ_LV : f === 'descoqueamento' ? COQ_LV * (1 - u) : 0 }; }
    t -= d;
  }
  return { f: 'pronto', u: 1, lv: 0 };
}

/* Pequeno emissor de partículas (bolhas, jatos de água, pedaços de coque). */
function coqEmitter(g, n) { const P = { I: swarm(g, n, SPH_LO), n, k: 0 }; for (const f of ['x', 'y', 'z', 'vx', 'vy', 'vz', 'l', 'L', 's', 'gr', 'yf']) P[f] = new Float32Array(n); P.l.fill(0); return P; }
function coqEmit(P, x, y, z, vx, vy, vz, life, col, size, gr = 0, yf = -99) {
  const i = P.k++ % P.n; P.x[i] = x; P.y[i] = y; P.z[i] = z; P.vx[i] = vx; P.vy[i] = vy; P.vz[i] = vz; P.l[i] = P.L[i] = life; P.s[i] = size; P.gr[i] = gr; P.yf[i] = yf;
  P.I.setColorAt(i, _c3.setHex(col));
}
function coqStep(P, dt) {
  for (let i = 0; i < P.n; i++) {
    if (P.l[i] <= 0) { P.I.setMatrixAt(i, ZERO); continue; }
    P.l[i] -= dt; P.vy[i] -= P.gr[i] * dt;
    P.x[i] += P.vx[i] * dt; P.y[i] += P.vy[i] * dt; P.z[i] += P.vz[i] * dt;
    if (P.y[i] < P.yf[i]) { P.y[i] = P.yf[i]; P.vx[i] = P.vy[i] = P.vz[i] = 0; }
    const k = Math.min(1, P.l[i] * 3, (P.L[i] - P.l[i]) * 8 + .2);
    place(P.I, i, P.x[i], P.y[i], P.z[i], P.s[i] * k);
  }
  flush(P.I);
}

/* =====================================================================
   28. INTERFACE DE CELULAR
       Em telas estreitas (ou celular deitado) a barra superior, a legenda, o painel e o dock dão lugar a:
       barra fina no topo (menu, maquete, título, pausa), gaveta inferior com as abas Texto (o painel) e
       Controles (o dock da cena), que se arrasta pelo cabeçalho, e navegação ◀ passo ▶ na base.
       Em paisagem a gaveta vira uma coluna à direita. O painel e o dock são os mesmos elementos, só mudam de lugar.
   ===================================================================== */
const mob = { on: false, land: false, st: 'half', tab: 'texto', h: -1, newCtl: false, rt: 0 };

const sheetEl = $('#sheet'), sheetH = $('#sheet-h');
/* No celular os textos falam em tocar, não em clicar ou usar o mouse. */
const toque = (h) => h.replace(/Clique/g, 'Toque').replace(/clique/g, 'toque')
  .replace(/arraste para girar, use a roda do mouse para aproximar/g, 'arraste com um dedo para girar, use dois dedos para aproximar')
  .replace(/Na cena ao lado/g, () => (mob.land ? 'Na cena ao lado' : 'Na cena acima'));

  .replace(/\bclique (nas|em|para)/g, 'toque $1').replace(/^Clique /, 'Toque ').replace(/ no painel/g, ' nos controles')
  .replace(/Arraste para girar · roda do mouse para aproximar/, 'Um dedo gira · dois dedos aproximam e movem').replace(/arraste para girar/g, 'um dedo gira, dois aproximam'));

function mobHeights() {
  const hh = sheetH.offsetHeight || 48, avail = Math.max(hh, window.innerHeight - $('#mbar').offsetHeight - $('#mnav').offsetHeight - 6);
  return mob.land ? { closed: hh, half: avail, full: avail } : { closed: hh, half: Math.round(clamp(avail * .48, hh, avail)), full: avail };
}
/* Muda o estado e/ou a aba da gaveta; com a área livre diferente, a câmera se afasta ou se aproxima
