  if (!mob.on) return;
  if (st) mob.st = st;
  if (tab) mob.tab = tab;
  if (mob.tab === 'ctl' && !cur) mob.tab = 'texto';
  if (mob.tab === 'ctl') mob.newCtl = false;
  sheetEl.dataset.tab = mob.tab;
  for (const b of sheetH.querySelectorAll('[data-tab]')) {
    b.classList.toggle('on', b.dataset.tab === mob.tab); b.setAttribute('aria-selected', b.dataset.tab === mob.tab);
    if (b.dataset.tab === 'ctl') { b.hidden = !cur; b.classList.toggle('new', mob.newCtl && !!cur); }
  }
  const H = mobHeights(), h = H[mob.st];
  $('#sh-up').disabled = h >= H.full; $('#sh-dn').disabled = mob.st === 'closed';
  if (h === mob.h) return;

  mob.h = h; sheetEl.style.height = h + 'px';
  resize();
  if (!refit) return;
  const f1 = fitK(); if (Math.abs(f1 / f0 - 1) < .01) return;
  const tg = (tween ? tween.q1 : controls.target).clone(), ps = tween ? tween.p1 : camera.position;
  flyTo({ pos: tg.clone().add(ps.clone().sub(tg).multiplyScalar(f1 / f0)), target: tg }, .5);
}
function measureMob(sr) {
  const W = sr.width, H = sr.height, top = $('#mbar').offsetHeight, nav = $('#mnav').offsetHeight, sw = sheetEl.offsetWidth;
  document.body.classList.remove('dock-top');
  ui.left = 0; ui.top = top;
  ui.right = mob.land && mob.st !== 'closed' ? sw : 0;
  // gaveta cheia é modo leitura: a cena fica enquadrada como na metade, sem se afastar à toa
  ui.bottom = clamp(nav + (mob.land ? 0 : clamp(mob.h, 0, mobHeights().half)), 0, H * .8);
  ui.rects = [0, W, 0, top + 2, mob.land ? W - sw : 0, W, H - nav - Math.max(mob.h, 0) - 4, H];
  if (document.body.classList.contains('menu-open')) { const r = $('#mmenu').getBoundingClientRect(); ui.rects.push(r.left - sr.left, r.right - sr.left, r.top - sr.top, r.bottom - sr.top); }
}
/* Toque numa peça da cena: a explicação aparece na aba Controles (abre a gaveta se estiver fechada). */
function mobShowInfo() {
  mobSheet(mob.st === 'closed' ? 'half' : null, 'ctl');
  requestAnimationFrame(() => { const el = $('#dk-info'); if (el && el.offsetParent) dockEl.scrollTo({ top: Math.max(0, el.offsetTop - 8), behavior: 'smooth' }); });
}
function mobSync() {
  if (!mob.on) return;
  let k, t;
  if (cur) { const c = CONTEUDO[cur.content]; k = (c.cap ? c.cap + ' · ' : '') + 'cena 3D'; t = fmt(cur.title || c.titulo); }
  else if (state.content !== 'inicio') { k = 'Maquete da refinaria'; t = fmt(CONTEUDO[state.content].titulo); }
  else { k = 'Tecnologia Orgânica I · EQO 364'; t = 'Petróleo e Refino 3D'; }
  $('#mb-title').innerHTML = `<small>${k}</small><b>${t}</b>`;
  $('#mb-home').disabled = !cur && state.content === 'inicio';
  const s = TOUR[state.step], last = state.step >= TOUR.length - 1;
  $('#mn-step').innerHTML = state.step < 0 ? '<small>Início · ver os passos ▾</small><b>Visão geral</b>'
    : `<small>Passo ${state.step + 1} de ${TOUR.length} · ver todos ▾</small><b>${fmt(CONTEUDO[s.c].titulo)}</b>`;
  $('#mn-prev').disabled = state.step < 0;
  $('#mn-next').textContent = state.step < 0 ? 'Começar ▶' : last ? '⌂' : '▶';
  $('#mn-next').setAttribute('aria-label', state.step < 0 ? 'Começar o tour' : last ? 'Voltar ao início' : 'Próximo passo');
  for (const b of document.querySelectorAll('#mmenu [data-mode]')) b.classList.toggle('on', b.dataset.mode === state.mode);
  for (const b of document.querySelectorAll('#mmenu [data-lbl]')) b.classList.toggle('on', b.dataset.lbl === state.labels);
  mobSheet(null, null);
}
function mobMenu(open) {
  document.body.classList.toggle('menu-open', open);
  $('#mb-menu').setAttribute('aria-expanded', open); $('#mb-menu').textContent = open ? '✕' : '☰';
  if (open) { mobSync(); $('#mm-spd').value = sim.speed; $('#mm-spd-o').textContent = $('#speed-o').textContent; }
  measureUI();
}
/* Lista de passos (toque no nome do passo, na base). */
function mobSteps() {
  let h = `<h2>Caminho do óleo</h2><div class="msteps"><button data-step="-1" class="${state.step < 0 ? 'on' : ''}"><i>⌂</i><span>Visão geral da maquete</span></button>`;
  for (const g of GRUPOS) {
    h += `<div class="ms-g" style="--pc:${g.c}">${g.n}</div>`;
    TOUR.forEach((s, i) => { if (s.g === g.k) h += `<button data-step="${i}" class="${i === state.step ? 'on' : ''}${state.visited.has(i) ? ' seen' : ''}"><i>${i + 1}</i><span>${fmt(CONTEUDO[s.c].titulo)}</span></button>`; });
  }
  $('#modal-body').innerHTML = h + '</div>';
  $('#modal').classList.add('open');
  $('#modal-body').querySelector('.on')?.scrollIntoView({ block: 'center' });
}
function mobBuild() {
  $('#mmenu').innerHTML = `<div class="mm-lab">Modo</div><div class="seg"><button data-mode="tour">Tour guiado</button><button data-mode="explorar">Exploração livre</button></div>
    <div class="mm-lab">Rótulos na cena 3D</div><div class="seg"><button data-lbl="all">Todos</button><button data-lbl="units">Principais</button><button data-lbl="none">Nenhum</button></div>
    <div class="mm-lab"><span>Velocidade das animações</span><output id="mm-spd-o">1×</output></div><input id="mm-spd" type="range" min="0.25" max="2" step="0.25" value="1" aria-label="Velocidade das animações">
    <button class="btn mm-btn" data-mm="glos">Glossário de siglas</button>
    <div class="mm-lab">Cores das frações</div><ul class="mm-leg">${$('#lg-list').innerHTML}</ul>
    <div class="mm-hint"><b>Como mexer:</b> um dedo gira a cena; dois dedos aproximam e movem. Toque numa unidade ou peça para ler sobre ela. Arraste a gaveta pelo cabeçalho para ver mais texto ou mais cena.</div>`;
  $('#mmenu').addEventListener('click', (e) => {
    const m = e.target.closest('[data-mode]');
    if (m) { if (m.dataset.mode === 'tour') { setMode('tour'); goStep(state.step < 0 ? 0 : state.step); } else setMode('explorar'); return mobMenu(false); }
    const l = e.target.closest('[data-lbl]');
    if (l) { state.labels = l.dataset.lbl; $('#b-labels').textContent = LBL_MODES.find((x) => x[0] === state.labels)[1]; return mobSync(); }
    if (e.target.closest('[data-mm=glos]')) { mobMenu(false); $('#b-glos').click(); }
  });
  $('#mm-spd').addEventListener('input', (e) => { $('#speed').value = e.target.value; $('#speed').dispatchEvent(new Event('input')); $('#mm-spd-o').textContent = $('#speed-o').textContent; });
  $('#mb-menu').onclick = () => mobMenu(!document.body.classList.contains('menu-open'));
  document.addEventListener('pointerdown', (e) => { if (document.body.classList.contains('menu-open') && !e.target.closest?.('#mmenu,#mb-menu')) mobMenu(false); }, true);
  $('#mb-home').onclick = () => (cur ? backToHub() : goHome());
  $('#mb-pause').onclick = togglePause;
  $('#mn-prev').onclick = () => { if (state.mode !== 'tour') setMode('tour'); prev(); };
  $('#mn-next').onclick = () => { if (state.mode !== 'tour') setMode('tour'); next(); };
  $('#mn-step').onclick = mobSteps;
  $('#modal-body').addEventListener('click', (e) => {
    const b = e.target.closest('[data-step]'); if (!b) return;
    $('#modal').classList.remove('open');
    const i = +b.dataset.step; if (i < 0) goHome(); else goStep(i);
  });
  // gaveta: toque no cabeçalho abre/fecha; arrastar (inclusive sobre as abas) muda a altura e encaixa no estado mais próximo
  let drag = null, dragged = false;
  sheetH.addEventListener('pointerdown', (e) => { drag = { id: e.pointerId, y: e.clientY, h: sheetEl.offsetHeight, on: false }; dragged = false; });
  sheetH.addEventListener('pointermove', (e) => {
    if (!drag || e.pointerId !== drag.id) return;
    const dy = drag.y - e.clientY;
    if (!drag.on) { if (Math.abs(dy) < 8) return; drag.on = dragged = true; sheetEl.classList.add('drag'); try { sheetH.setPointerCapture(e.pointerId); } catch (_) { /* sem captura: segue sem ela */ } }
    const H = mobHeights(); sheetEl.style.height = clamp(drag.h + dy, H.closed, H.full) + 'px';
  });
  const endDrag = (e) => {
    if (!drag || e.pointerId !== drag.id) return;
    const d = drag; drag = null; if (!d.on) return;
    sheetEl.classList.remove('drag');
    const H = mobHeights(), h = sheetEl.offsetHeight;
    const st = ['closed', 'half', 'full'].reduce((a, k) => (Math.abs(H[k] - h) < Math.abs(H[a] - h) ? k : a), 'closed');
    if (H[st] === mob.h) sheetEl.style.height = mob.h + 'px';   // voltou ao mesmo estado: só encaixa
    mobSheet(st);
  };
  sheetH.addEventListener('pointerup', endDrag); sheetH.addEventListener('pointercancel', endDrag);
  sheetH.addEventListener('click', (e) => {
    if (dragged) { dragged = false; return; }
    const t = e.target.closest('.sh-tabs button');
    if (t) return mobSheet(mob.st === 'closed' ? 'half' : null, t.dataset.tab);
    if (e.target.closest('#sh-up')) return mobSheet(mob.st === 'closed' ? 'half' : 'full');
    if (e.target.closest('#sh-dn')) return mobSheet(mob.st === 'full' && !mob.land ? 'half' : 'closed');
    mobSheet(mob.st === 'closed' ? 'half' : 'closed');
  });
  mobMQ.addEventListener('change', mobApply);
  window.addEventListener('resize', () => { if (mob.on) mobApply(); });
}
/* Liga ou desliga o modo celular (e acompanha a rotação da tela). */
function mobApply() {
  const on = mobMQ.matches, land = on && window.innerWidth > window.innerHeight;
  const turned = on !== mob.on || (on && land !== mob.land);
  if (on !== mob.on) {
    mob.on = on;
    document.body.classList.toggle('mob', on);
    if (on) {
      $('#sheet-b').append($('#panel'), dockEl);
      dockEl.classList.remove('min'); dockEl.style.top = dockEl.style.maxHeight = '';
    } else {
      mobMenu(false);
      $('#app').append($('#panel')); stage.insertBefore(dockEl, $('#topbar'));
      if (window.innerWidth > 860) setPanel(true);
    }
    showContent(state.content);
    if (cur) renderDock();
  }
  mob.land = land; document.body.classList.toggle('land', land);
  if (on) { mob.h = -1; mobSheet(null, null, false); mobSync(); }
  else resize();
  // trocou de layout ou girou a tela: reenquadra quando o palco já tem o tamanho novo (na rotação o navegador
  // pode passar por tamanhos intermediários, então repete uma vez pouco depois)
  if (turned) { requestAnimationFrame(() => mobRefit()); clearTimeout(mob.rt); mob.rt = setTimeout(mobRefit, 450); }
}
function mobRefit(n = 0) {
  if ((stage.clientWidth < 100 || stage.clientHeight < 100) && n < 30) return requestAnimationFrame(() => mobRefit(n + 1));
  resize(); jumpTo(cur ? cur.cam(cur) : hubCamNow());
}
/* Câmera da maquete para o conteúdo atual (passo do tour ou unidade aberta na exploração). */
function hubCamNow() {
  const s = TOUR[state.step];
  if (state.content === 'inicio' || !s) return CAMS.overview();
  if (s.c === state.content) return camOf(s.cam || s.unit);
  const u = Object.values(UNITS).find((x) => x.content === state.content);
  return u ? camForUnit(u.id) : CAMS.overview();
}

/* =====================================================================
   29. INICIALIZAÇÃO E LAÇO DE ANIMAÇÃO
   ===================================================================== */
function resize() {
  const w = stage.clientWidth, h = stage.clientHeight;
  if (!w || !h) return;
  renderer.setSize(w, h, false);
  $('#labels').classList.toggle('compact', w < 1100 || h < 800);
  measureLabels();
  measureUI();
  // o centro óptico fica no meio da área livre: entre a barra superior e a inferior e, nas cenas, à direita do dock
  const off = viewShift(), offX = Math.abs(ui.left - ui.right);
  camera.aspect = (w + offX) / (h + off);
  camera.setViewOffset(w + offX, h + off, ui.right > ui.left ? offX : 0, ui.bottom > ui.top ? off : 0, w, h);
}
new ResizeObserver(resize).observe(stage);
resize();

buildGround();
buildReservatorio(); buildPrimario(); buildDessalgadora(); buildAtmosferica(); buildVacuo(); buildDesasfaltacao();
buildFCC(); buildReforma(); buildCoque(); buildTratamentos(); buildProdutos();
buildFlows(); buildParticles();
buildTimeline();
applyFocus();
mobBuild(); mobApply();
showContent('inicio');
syncUI();
if (!mob.on && window.innerWidth <= 860) { setPanel(false); $('#legend').classList.add('min'); $('#lg-x').textContent = '+'; }
resize();
{ const c = CAMS.overview(); camera.position.copy(c.pos); controls.target.copy(c.target); }
measureLabels();
document.fonts?.ready.then(() => { measureLabels(); resize(); });

const clock = new THREE.Clock();
function frame(dtr) {
  const dt = sim.paused ? 0 : dtr * sim.speed;
  sim.t += dt;
  updateTween(dtr);
  controls.update();
  if (cur) { cur.update(cur, dt, dtr); infoTick(dtr); }
  else { updateFlows(dt); updateHighlights(dtr); }
  renderer.render(scene, camera);
  updateLabels();
}
renderer.setAnimationLoop(() => frame(Math.min(clock.getDelta(), .05)));
clearTimeout(window.__bootT);
requestAnimationFrame(() => { const b = $('#boot'); if (b && !b.classList.contains('fail')) { b.classList.add('ok'); setTimeout(() => b.remove(), 600); } });

/* Ganchos para depuração no console (advance(s) avança a simulação s segundos de uma vez). */
window.__refino = { scene, camera, controls, mob, UNITS, FLOWS, LABELS, state, goStep, openUnit, goHome, setMode, SC, enterScene, exitScene, backToHub,
  setView: (k) => cur && setView(cur, k), get cur() { return cur; },
  advance: (s = 3) => { for (let i = 0; i < Math.round(s * 60); i++) frame(1 / 60); } };
</script>
