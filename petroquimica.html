<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Do Poço à Petroquímica – Visualização 3D</title>
<style>
:root{--bg:#f3f5f8;--fg:#14202e;--card:rgba(255,255,255,.92);--bd:#c9d2dd;--ac:#d2691e;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b1220;--fg:#e8eef6;--card:rgba(18,28,44,.92);--bd:#2c3b52;--ac:#ff9a4d}}
:root[data-theme="dark"]{--bg:#0b1220;--fg:#e8eef6;--card:rgba(18,28,44,.92);--bd:#2c3b52;--ac:#ff9a4d}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden}
#app{position:relative;height:100%}
canvas{display:block;width:100%;height:100%;touch-action:none}
header{position:absolute;top:8px;left:12px;right:12px;font-weight:700;font-size:15px;pointer-events:none;text-shadow:0 1px 3px var(--bg)}
header small{font-weight:400;opacity:.75;display:block}
#panel{position:absolute;left:12px;bottom:64px;width:min(430px,calc(100% - 24px));max-height:52%;overflow:auto;background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px 14px;font-size:13.5px;line-height:1.45}
#panel h2{margin:0 0 6px;font-size:16px;color:var(--ac)}
#panel p{margin:0 0 8px}#pt{cursor:pointer}#pmin{float:right;position:sticky;top:0;margin-left:8px;width:30px;height:26px;border:1px solid var(--bd);background:var(--card);color:var(--fg);border-radius:6px;cursor:pointer;font-size:14px;line-height:1}#panel.min{max-height:none;overflow:hidden}#panel.min>:not(h2):not(#pmin):not(#info){display:none}
#panel li{margin:3px 0}
#tip{position:fixed;display:none;z-index:9;pointer-events:none;max-width:420px;background:var(--card);border:1px solid var(--ac);border-radius:8px;padding:8px 10px;font-size:12.5px;line-height:1.4;box-shadow:0 4px 14px rgba(0,0,0,.35)}.io-i{color:#2e9e4f}.io-o{color:#2e9e4f}.gi{color:#2e9e4f;font-weight:600}div.gi{font-weight:500}.tl{margin:2px 0 4px;padding-left:18px}.tl li{margin:1px 0}.g b{color:#2e9e4f}#ex{margin-top:6px}#ex hr{border:0;border-top:1px solid var(--bd)}#ex p{margin:0 0 8px}#chips{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}#chips button{font-size:12px;padding:4px 8px;border:1px solid var(--bd);background:transparent;color:var(--fg);border-radius:12px;cursor:pointer}#chips button:hover{background:var(--ac);color:#111}#info{margin-top:8px;padding:8px;border-left:3px solid var(--ac);background:rgba(128,128,128,.12);border-radius:4px;min-height:1.2em}
nav{position:absolute;left:12px;right:12px;bottom:10px;display:flex;gap:6px;overflow-x:auto}
nav button{flex:1 0 auto;padding:9px 10px;border:1px solid var(--bd);background:var(--card);color:var(--fg);border-radius:8px;font-size:13px;cursor:pointer;white-space:nowrap}
nav button.on{background:var(--ac);color:#111;border-color:var(--ac);font-weight:700}
</style>
</head>
<body>
<div id="app">
<header>Do Poço à Petroquímica<small>Arraste para girar · roda/pinça para zoom · clique nos equipamentos</small></header>
<div id="panel" class="min"><button id="pmin" title="Expandir resumo">▴</button><h2 id="pt"></h2><p id="pd"></p><ul id="pl"></ul><div id="ex"></div><div id="chips"></div><div id="info">Clique num equipamento para ver a função.</div></div>
<nav id="nav"></nav><div id="tip"></div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
addEventListener('error',e=>{const i=document.getElementById('info');if(i)i.textContent='Erro: '+e.message+' (linha '+e.lineno+')'});
const XS=[0,18,36,56,76,96];
const STEPS=[
{t:'1 · O Petróleo e os Contaminantes',c:0x8d6e63,d:'Mistura natural de hidrocarbonetos formada pela matéria orgânica soterrada (janela do óleo: catagênese, 60–150 °C). Contém carbono (83–87%), hidrogênio (10–14%) e contaminantes.',
 i:['Enxofre: corrosão, SOx, veneno de catalisadores','Nitrogenados: gomas e veneno de catalisadores','Ácidos naftênicos: corrosão ácida','Metais (Fe, Ni, V, Na): desativam catalisadores','Resinas e asfaltenos: aumentam a viscosidade']},
{t:'2 · Processamento Primário (campo)',c:0x42a5f5,d:'Trata o fluido bruto antes do transporte, evitando corrosão e riscos em dutos e navios.',
 i:['Separação trifásica: gás, óleo e água por gravidade','Desidratação: desemulsificantes rompem a emulsão','Especificação: BSW < 1% e sais < 300 mg/L']},
{t:'3 · Processos de Separação (refinaria)',c:0xffca28,d:'Operações físicas, sem reação química, baseadas em pontos de ebulição ou solubilidade.',
 i:['Dessalgadora: água + campo elétrico','Destilação atmosférica: gás, GLP, nafta, querosene, gasóleo, RAT','Destilação a vácuo: GOV e RV','UDASF: propano extrai asfaltenos → ODES e RASF']},
{t:'4 · Processos de Conversão',c:0xef5350,d:'Alteram a estrutura química de frações pesadas para gerar produtos leves de alto valor.',
 i:['UFCC: GOV, catalisador de zeólita, carbocátions, regenerador queima coque','Reforma catalítica: nafta → alta octanagem e BTX, produz H₂','Coqueamento retardado: resíduos, radicais livres, tambores de coque']},
{t:'5 · Processos de Tratamento',c:0x66bb6a,d:'Removem compostos corrosivos, tóxicos ou venenos de catalisador para atingir as especificações.',
 i:['Aminas (DEA/MEA/MDEA): remove H₂S e CO₂','Lavagem cáustica (NaOH): soda se esgota','MEROX/TCR: mercaptans → dissulfetos, soda regenerada']},
{t:'6 · Indústria Petroquímica',c:0xab47bc,d:'Produz espécies químicas puras e definidas, em menor escala e com maior intensidade de capital que o refino.',
 i:['1ª geração: eteno, propeno, butadieno, BTX, gás de síntese','2ª geração: PVC, polietileno, polipropileno','3ª geração: filmes, embalagens, tubos, autopeças','Rotas: pirólise a vapor (>700 °C), reforma, gases de FCC']}
];
const app=document.getElementById('app');
const R=new THREE.WebGLRenderer({antialias:true});R.setPixelRatio(Math.min(devicePixelRatio,2));app.insertBefore(R.domElement,app.firstChild);
const S=new THREE.Scene();S.background=new THREE.Color(0x0b1220);S.fog=new THREE.Fog(0x0b1220,60,200);
const cam=new THREE.PerspectiveCamera(50,1,.1,500);
S.add(new THREE.HemisphereLight(0xcfe3ff,0x223344,.9));
const dl=new THREE.DirectionalLight(0xffffff,.9);dl.position.set(30,50,30);S.add(dl);
const gr=new THREE.Mesh(new THREE.PlaneGeometry(260,60),new THREE.MeshStandardMaterial({color:0x16202e}));gr.rotation.x=-Math.PI/2;gr.position.set(48,-.01,0);S.add(gr);
const grid=new THREE.GridHelper(260,130,0x2a3a50,0x1d2a3b);grid.position.set(48,0,0);S.add(grid);
const pick=[];
const M=c=>new THREE.MeshStandardMaterial({color:c,roughness:.5,metalness:.35});
function reg(m,n,d){m.userData={n,d};pick.push(m);S.add(m);return m}
function cyl(x,y,z,r,h,c,n,d,rz){const m=new THREE.Mesh(new THREE.CylinderGeometry(r,r,h,24),M(c));m.position.set(x,y+(rz?0:h/2),z);if(rz)m.rotation.z=Math.PI/2;if(r>=.6){const cg=new THREE.SphereGeometry(r,20,8,0,6.2832,0,1.5708);for(const s of[1,-1]){const cp=new THREE.Mesh(cg,m.material);cp.position.y=s*h/2;cp.scale.y=.6;if(s<0)cp.rotation.x=Math.PI;cp.userData={n,d};m.add(cp)}}return reg(m,n,d)}
function box(x,y,z,w,h,l,c,n,d){const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,l),M(c));m.position.set(x,y+h/2,z);return reg(m,n,d)}
function sph(x,y,z,r,c,n,d){const m=new THREE.Mesh(new THREE.SphereGeometry(r,20,16),M(c));m.position.set(x,y+r,z);return reg(m,n,d)}
function tower(x,z,r,h,c,n,d,trays){cyl(x,0,z,r,h,c,n,d);for(let k=1;k<=trays;k++){const t=new THREE.Mesh(new THREE.TorusGeometry(r+.03,.04,6,24),M(0x9aa7b5));t.rotation.x=Math.PI/2;t.position.set(x,k*h/(trays+1),z);S.add(t)}}
function label(t,x,y,z){const c=document.createElement('canvas');c.width=1024;c.height=192;const g=c.getContext('2d');g.fillStyle='rgba(10,16,28,.8)';g.fillRect(0,0,1024,192);g.fillStyle='#fff';g.font='bold 68px sans-serif';g.textAlign='center';g.fillText(t,512,120);const s=new THREE.Sprite(new THREE.SpriteMaterial({map:new THREE.CanvasTexture(c)}));s.scale.set(7,1.3,1);s.position.set(x,y,z);S.add(s)}
// Station 1: reservoir + derrick
(function(){const x=XS[0];
box(x,-6,0,14,2,10,0x6d4c41,'Rocha-reservatório','Rocha porosa onde o petróleo migrou e ficou retido.');
box(x,-4,0,14,1.5,10,0x1b1b1b,'Camada de óleo','Hidrocarbonetos líquidos com contaminantes (S, N, O, metais, asfaltenos).');
box(x,-2.5,0,14,1,10,0x1e88e5,'Água de formação','Salmoura associada ao óleo no reservatório.');
box(x,-1.5,0,14,1.5,10,0xb0bec5,'Capa de gás','Gás natural associado, acima do óleo.');
cyl(x,-6,0,.25,10,0xcfd8dc,'Poço','Tubulação que traz o fluido bruto à superfície.');
for(const s of[-1,1]){const m=new THREE.Mesh(new THREE.CylinderGeometry(.1,.45,8,4),M(0xff8f00));m.position.set(x+s*.6,4,0);m.rotation.z=-s*.08;reg(m,'Torre de perfuração','Sustenta a coluna de perfuração e produção.')}
box(x,8,0,1.8,.4,1.8,0xff8f00,'Coroamento','Topo da torre.');
label('1 · Poço',x,11,0)})();
// Station 2: separator
(function(){const x=XS[1];
cyl(x,2.2,0,1.6,9,0x90a4ae,'Separador trifásico','Separa por gravidade: gás no topo, óleo no meio, água embaixo.',1);
cyl(x-2.5,1.6,0,.3,2.6,0xeeeeee,'Saída de gás','Fase gasosa (gás natural/associado).');
cyl(x,3.7,0,.3,2.5,0x212121,'Saída de óleo','Óleo cru para desidratação.');
cyl(x+3,.5,2,.3,2,0x42a5f5,'Saída de água','Salmoura: água, sais e sedimentos.');
cyl(x+5.5,0,-1,1.8,6,0x78909c,'Tanque de desidratação','Desemulsificantes e coalescência de gotas; óleo estabilizado BSW < 1%, sais < 300 mg/L.');
label('2 · Processamento primário',x,15.5,0)})();
// Station 3: desalter + furnace + towers
(function(){const x=XS[2];
cyl(x-6,1.6,0,1.3,6,0x78909c,'Dessalgadora','Lavagem com água e campo elétrico para remover sais antes das fornalhas.',1);
box(x-3,0,2.5,2.2,2.2,2.2,0xbf360c,'Fornalha','Aquece o óleo antes da torre.');
tower(x,0,1.4,13,0xb0bec5,'Torre de destilação atmosférica','Frações do topo ao fundo: gás combustível, GLP, nafta, querosene, gasóleo e RAT.',6);
tower(x+5,0,1.2,11,0x90a4ae,'Torre de vácuo','Processa o RAT a pressão reduzida, evitando craqueamento térmico: gera GOV e RV.',4);
tower(x+9.5,0,.9,7,0x607d8b,'UDASF','Extração líquido-líquido com propano: ODES e RASF.',2);
label('3 · Separação',x+2,16,0)})();
// Station 4: conversion
(function(){const x=XS[3];
cyl(x-5,0,0,.5,14,0xe53935,'Riser (UFCC)','Reator: quebra catalítica do GOV via carbocátions com zeólita.');
cyl(x-2,0,0,1.6,7,0xc62828,'Regenerador','Queima o coque do catalisador, reativando-o e gerando energia.');
cyl(x-2,0,-4,1.2,8,0x8e2424,'Vaso separador','Separa catalisador dos vapores.');
tower(x+3,-3,1,12,0xb0bec5,'Fracionadora','Separa os produtos do craqueamento.',5);
for(let k=0;k<3;k++)cyl(x-4+k*2.2,0,6,.8,4+k*.5,0x6d4c41,'Reator de reforma','Catalisador bifuncional Pt/Re: desidrociclização endotérmica, gera BTX e H₂.');
for(const s of[0,1])cyl(x+4+s*3.2,0,5,1.3,9,0x212121,'Tambor de coque','Coque se forma aqui (retardado) em batelada; carga: resíduos, via radicais livres, ~500 °C.');
label('4 · Conversão',x+1,15,0)})();
// Station 5: treatment
(function(){const x=XS[4];
tower(x-4,0,1.1,10,0x66bb6a,'Absorvedora de amina','Amina fria absorve H₂S e CO₂ de gás natural, gás de refinaria e GLP.',4);
tower(x,0,1.1,10,0x43a047,'Regeneradora de amina','Aquecimento libera o H₂S e regenera a amina.',4);
cyl(x+4,0,0,1.4,5,0x29b6f6,'Lavagem cáustica','NaOH forma sais solúveis; a soda se esgota e deve ser trocada.');
cyl(x+8,0,0,1.2,6,0xffb300,'MEROX / TCR','Ftalocianina de cobalto e ar oxidam mercaptans a dissulfetos e regeneram a soda.');
label('5 · Tratamento',x+2,14.5,0)})();
// Station 6: petrochem
(function(){const x=XS[5];
box(x-6,0,0,4,3.5,3,0xff6f00,'Fornalha de pirólise a vapor','Craqueia etano, propano ou nafta com vapor a mais de 700 °C: eteno e propeno.');
tower(x-1,0,1,12,0xb0bec5,'Coluna de fracionamento','Separa e purifica olefinas e aromáticos (1ª geração).',5);
for(let k=0;k<3;k++)sph(x+3+k*3.2,0,-3,1.4,0xce93d8,'Esfera de armazenamento','Armazena petroquímicos básicos (eteno, propeno, butadieno).');
box(x+4,0,3.5,5,2.2,3,0x8e24aa,'2ª geração','Polimerização: PVC, polietileno, polipropileno.');
box(x+10,0,3.5,5,3.2,3,0x6a1b9a,'3ª geração','Transformação em filmes, embalagens, tubos e autopeças.');
label('6 · Petroquímica',x+3,14.5,0)})();
// ---- detalhes ----
const FL=[];
function pp(a,b,r,c){const A=new THREE.Vector3(...a),B=new THREE.Vector3(...b),L=A.distanceTo(B),m=new THREE.Mesh(new THREE.CylinderGeometry(r||.12,r||.12,L,8),M(c||0x8a97a6));m.position.copy(A).add(B).multiplyScalar(.5);m.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0),B.clone().sub(A).normalize());S.add(m)}
function lad(x,z,r,h){const q=x+r+.15;pp([q,0,z-.2],[q,h,z-.2],.03,0xffc107);pp([q,0,z+.2],[q,h,z+.2],.03,0xffc107);for(let y=.6;y<h;y+=.7)pp([q,y,z-.2],[q,y,z+.2],.025,0xffc107)}
function plat(x,y,z,r){const t=new THREE.Mesh(new THREE.TorusGeometry(r+.45,.07,6,28),M(0xffc107));t.rotation.x=Math.PI/2;t.position.set(x,y,z);S.add(t);const f=new THREE.Mesh(new THREE.CylinderGeometry(r+.45,r+.45,.06,28),M(0x546e7a));f.position.set(x,y,z);S.add(f)}
const GT=(()=>{const c=document.createElement('canvas');c.width=c.height=64;const g=c.getContext('2d');const r=g.createRadialGradient(32,32,0,32,32,32);r.addColorStop(0,'rgba(255,200,100,1)');r.addColorStop(.4,'rgba(255,110,20,.45)');r.addColorStop(1,'rgba(255,60,0,0)');g.fillStyle=r;g.fillRect(0,0,64,64);return new THREE.CanvasTexture(c)})();
function fl(x,y,z,s){const G=new THREE.Group();G.position.set(x,y,z);S.add(G);
const cs=[[.5,1.9,0xff3d00,.65],[.36,1.5,0xff8f00,.8],[.2,1.0,0xffe082,.95]].map(([r,h,c,o])=>{const m=new THREE.Mesh(new THREE.ConeGeometry(r*s,h*s,12,1,true),new THREE.MeshBasicMaterial({color:c,transparent:true,opacity:o,blending:THREE.AdditiveBlending,depthWrite:false,side:THREE.DoubleSide}));m.position.y=h*s/2;G.add(m);return m});
const gl=new THREE.Sprite(new THREE.SpriteMaterial({map:GT,blending:THREE.AdditiveBlending,depthWrite:false,transparent:true}));gl.position.y=.8*s;G.add(gl);
const em=[];for(let k=0;k<8;k++){const e=new THREE.Mesh(new THREE.SphereGeometry(.05*s,6,5),new THREE.MeshBasicMaterial({color:0xffb74d,transparent:true}));G.add(e);em.push([e,Math.random()])}
const ph=Math.random()*10;
FL.push({tick(t){cs.forEach((m,i)=>{const w=Math.sin(t*(9+i*4)+ph+i)*.5+Math.sin(t*17+i*3+ph)*.3;m.scale.set(1+.12*w,1+.3*w+.1*Math.sin(t*23+i),1+.12*w);m.rotation.y=t*(1+i)+ph});gl.material.opacity=.75+.25*Math.sin(t*15+ph);gl.scale.setScalar(s*(3.6+.5*Math.sin(t*11+ph)));em.forEach(([e,o])=>{const u=(t*.5+o)%1;e.position.set(Math.sin(o*40+t)*.3*s*u,(1+u*3.5)*s,Math.cos(o*40)*.3*s*u);e.material.opacity=1-u;e.scale.setScalar(1-u*.7)})}})}
function flOld(x,y,z,s){const m=new THREE.Mesh(new THREE.ConeGeometry(.35*s,1.3*s,10),new THREE.MeshBasicMaterial({color:0xff7a1a}));m.position.set(x,y+.65*s,z);S.add(m);const c=new THREE.Mesh(new THREE.ConeGeometry(.18*s,.8*s,8),new THREE.MeshBasicMaterial({color:0xffe082}));c.position.set(x,y+.45*s,z);S.add(c);FL.push(m,c)}
function valve(x,y,z){const v=new THREE.Mesh(new THREE.SphereGeometry(.22,10,8),M(0xd32f2f));v.position.set(x,y,z);S.add(v);const w=new THREE.Mesh(new THREE.TorusGeometry(.3,.04,6,14),M(0xd32f2f));w.position.set(x,y+.3,z);w.rotation.x=Math.PI/2;S.add(w)}
function leg(x,z,w,h){for(const a of[-1,1])for(const b of[-1,1])pp([x+a*w,0,z+b*w],[x+a*w,h,z+b*w],.08,0x78909c)}
XS.slice(1).forEach(x=>{const s=new THREE.Mesh(new THREE.BoxGeometry(26,.15,20),M(0x2a3648));s.position.set(x+2,.075,0);S.add(s)});
for(let x=0;x<=XS[5]+12;x+=8){pp([x,0,5],[x,.6,5],.08,0x546e7a);pp([x,.2,4.6],[x,.2,5.4],.06,0x546e7a)}
// 1 · poço
(function(){const x=XS[0];
const pj=new THREE.Group();pj.position.set(x-9,4.5,0);S.add(pj);
const bm=new THREE.Mesh(new THREE.BoxGeometry(5,.35,.5),M(0xfbc02d));pj.add(bm);
const hd=new THREE.Mesh(new THREE.BoxGeometry(.5,1.4,.5),M(0xf9a825));hd.position.set(-2.5,-.6,0);pj.add(hd);
const cw=new THREE.Mesh(new THREE.BoxGeometry(.8,1.2,.5),M(0x455a64));cw.position.set(2.4,-.5,0);pj.add(cw);
pp([x-9.9,0,0],[x-9,4.4,0],.1,0xf9a825);pp([x-8.1,0,0],[x-9,4.4,0],.1,0xf9a825);pp([x-11.5,3.2,0],[x-11.5,0,0],.05,0xeeeeee);
box(x-10.5,0,0,3.4,.5,1.4,0x546e7a,'Base do cavalo-de-pau','Bomba mecânica que eleva o óleo em poços de baixa pressão.');
window.__pj=pj;
cyl(x,0,0,.4,1.3,0x37474f,'Árvore de natal','Conjunto de válvulas na boca do poço que controla a vazão.');
valve(x+.6,.9,0);valve(x-.6,.9,0);
for(const[a,b]of[[-.6,2],[.6,4],[.5,6]])pp([x-.6,a+1,.1],[x+.5,b,.1],.04,0xffa000);
for(let k=0;k<3;k++)cyl(x+9+k*.9,0,3,.4,.9,0x212121,'Barril','Unidade de volume do petróleo (≈159 L).');
pp([x+.3,1.3,0],[x+8,1.3,4.6],.1,0x212121);pp([x+8,1.3,4.6],[x+8,.6,5],.1,0x212121);
})();
// 2 · primário
(function(){const x=XS[1];
leg(x,0,1.1,2.2);
for(const[a,b]of[[-1.3,1.4],[1.3,1.4]])valve(x+(a<0?-2.5:3),a<0?.5:1.8,a<0?0:2);
cyl(x+10,0,6,.25,12,0xb0bec5,'Tocha (flare)','Queima com segurança o gás excedente, evitando riscos.');
fl(x+10,12,6,1.6);
pp([x-2.5,4.2,0],[x-2.5,13,0]);pp([x-2.5,13,0],[x+10,12,6]);
pp([x,6.2,0],[x+5.5,6,-1]);pp([x+3,2.5,2],[x+3,.4,5]);
lad(x,0,1.6,11.2);plat(x,8,0,1.6);

'Regenerador':['Regenerador do Catalisador','Catalisador coqueificado + ar.','Queima parcialmente o coque (formando CO), reativa o catalisador e fornece o calor das reações endotérmicas do riser. Os gases seguem para a <b>caldeira de CO</b>.'],
'Vaso separador':['Vaso Separador (UFCC)','Efluente do riser: vapores + catalisador.','Separa o catalisador, enviado ao regenerador, dos <b>vapores craqueados</b>, enviados à fracionadora.'],
'Fracionadora':['Fracionadora Principal (UFCC)','Corrente craqueada vinda do reator.','Fraciona em <b>gás combustível, GLP, nafta craqueada, Óleo Leve de Reciclo (LCO) e Óleo Decantado (OD)</b>.'],
'Reator de reforma':['Reforma Catalítica','<b>Nafta pesada hidrotratada</b> (o HDT remove S, N, O e metais).','O catalisador bifuncional Pt-Re rearranja as moléculas sem alterar o nº de carbonos (desidrociclização e desidrogenação, endotérmicas). Gera <b>reformado de alta octanagem, BTX e H₂</b>.'],
'Fornalha de reaquecimento':['Fornalha de Reaquecimento (Reforma)','Efluente frio do reator anterior.','Como as reações são endotérmicas, reaquece a carga entre os reatores em série; sai <b>nafta reaquecida</b>.'],
'Tambor de coque':['Coqueamento Retardado (Tambor de Coque)','<b>Resíduos pesados (RAT, RV, OD)</b> aquecidos a ~500 °C na fornalha.','O craqueamento térmico (radicais livres) e a formação de coque são <i>retardados</i> para o tambor, evitando entupir as serpentinas. Operam em batelada alternada (~24 h). Saem <b>gás, GLP, nafta, gasóleos</b> e <b>Coque Verde de Petróleo (CVP)</b>.'],
'Casa de perfuração do coque':['Descoqueamento','Coque sólido do tambor cheio.','O coque é cortado por jato de água, enquanto o outro tambor enche e o ciclo continua.'],
'Absorvedora de amina':['Tratamento com Aminas – Absorção (DEA/MEA/MDEA)','Gás natural, gás de refinaria ou GLP com <b>H₂S e CO₂</b> + amina pobre.','Absorção química reversível: a amina reage com os gases ácidos. Sai o <b>gás/GLP tratado</b> no topo e a <b>amina rica</b> no fundo.'],
'Regeneradora de amina':['Tratamento com Aminas – Regeneração','<b>Amina rica</b> (carregada com H₂S e CO₂).','O aquecimento decompõe os sais, libera <b>H₂S e CO₂</b> no topo e devolve a <b>amina pobre</b> ao ciclo.'],
'Lavagem cáustica':['Lavagem Cáustica (Processo Não Regenerativo)','GLP ou gasolina com H₂S, mercaptans (RSH) e COS + solução de NaOH.','O NaOH neutraliza os ácidos fracos, formando sais solúveis em água; depois ocorrem decantação e lavagem com água. Sai o <b>hidrocarboneto tratado</b> e a <b>soda exausta</b>, que não é recuperada e exige descarte.'],
'MEROX / TCR':['Tratamento Cáustico Regenerativo (MEROX)','Nafta, querosene ou GLP com <b>mercaptans</b> + soda + ar.','O catalisador de ftalocianina de cobalto sulfonado e o O₂ oxidam os mercaptans a <b>dissulfetos (RSSR)</b> e regeneram a soda. Sai o <b>produto adoçado</b>.'],
'Esfera de GLP':['Esfera de GLP','GLP tratado.','Armazena o <b>GLP</b> sob pressão.'],
'Fornalha de pirólise a vapor':['Pirólise a Vapor (Steam Cracking)','<b>Nafta, etano, propano ou GLP</b> + vapor de água.','Craqueamento térmico endotérmico, sem catalisador, a mais de 700 °C e baixa pressão (&lt; 200 kPa). Gera <b>eteno, propeno, butadieno, H₂ e nafta de pirólise</b>; o etano rende cerca de 75–80% de eteno e a nafta cerca de 28–30%.'],
'Coluna de fracionamento':['Fracionamento dos Petroquímicos Básicos','Gás craqueado resfriado.','Separa e purifica as <b>olefinas leves</b> (eteno, propeno, butadieno) e os aromáticos (BTX) da 1ª geração.'],
'Esfera de armazenamento':['Armazenamento dos Básicos','Eteno, propeno e butadieno.','Estoca os <b>petroquímicos básicos</b> que alimentam a 2ª geração.'],
'2ª geração':['2ª Geração (Intermediários e Resinas)','Eteno, propeno, benzeno, xilenos, metanol e amônia.','A síntese química gera <b>cloreto de vinila, MEG, acrilonitrila, estireno, fenol, LAB, ácido tereftálico, formol, ureia</b> e resinas (PE, PP, PVC).'],
'3ª geração':['3ª Geração (Transformação)','Resinas e polímeros (PE, PP, PVC, PS, PET).','Transformação física e química em <b>filmes, embalagens, tubos, fibras, borrachas, espumas e autopeças</b>.'],
'Silo de pellets':['Silo de Resina','Pellets de plástico da 2ª geração.','Armazena a resina até a transformação em produtos finais.']};
const DET2={
'Dessalgadora':['Dessalgadora (Tratamento Pré-Destilação)','Petróleo Cru / Bruto vindo do processamento primário.',['O petróleo cru frio é aquecido previamente em trocadores de calor para reduzir a sua viscosidade.','Recebe a injeção de água doce de lavagem e aditivo desemulsificante sob tempo de residência e turbulência ajustados para desestabilizar a emulsão água-óleo.','Entra no vaso dessalgador sob a ação de um campo elétrico alternado e rápido, que polariza as gotículas de água salgada, forçando choques sucessivos e promovendo a coalescência (agrupamento em gotas maiores que decantam no fundo).'],['<b>Topo:</b> Petróleo Dessalgado, pronto e aquecido para seguir às fornalhas da destilação.','<b>Fundo:</b> Água salgada residual (efluente de lavagem descartado).']],
'Torre de destilação atmosférica':['Destilação Atmosférica (Pressão de 1 atm)','Petróleo Dessalgado e Aquecido a altas temperaturas nas fornalhas da refinaria.',['O petróleo aquecido entra pelo ponto <i>flash</i> na região inferior da torre de destilação.','A separação ocorre por variação de energia (temperatura) a 1 atm, com vaporizações e condensações sucessivas ao longo de pratos teóricos, em função da volatilidade/ponto de ebulição das moléculas.','A torre utiliza refluxo no topo (retorno de líquido frio) e refervedor no fundo para manter o equilíbrio líquido-vapor.'],['<b>Topo:</b> Gás Combustível (C₁–C₂).','<b>Saídas laterais superiores:</b> GLP (C₃–C₄) e Nafta Leve (C₅–C₈).','<b>Saídas laterais intermediárias:</b> Nafta Pesada (C₁₀–C₁₂), carga para a Reforma Catalítica, e Querosene (C₁₁–C₁₂), QAV/iluminação.','<b>Saída lateral inferior:</b> Gasóleo Atmosférico (C₁₃–C₂₅), origina o Óleo Diesel.','<b>Fundo da torre:</b> Resíduo Atmosférico (RAT), moléculas pesadas não vaporizadas.']],
'Torre de vácuo':['Destilação a Vácuo (Pressão Reduzida)','Resíduo Atmosférico (RAT) vindo do fundo da torre atmosférica.',['Como o RAT contém moléculas muito pesadas que sofreriam craqueamento térmico indesejado se fossem reaquecidas a altas temperaturas sob pressão normal, a torre opera sob pressão reduzida (vácuo).','A pressão reduzida é mantida por um sistema de ejetores de vácuo em 3 estágios (com pré, inter e pós-condensadores).','Diferente da torre atmosférica, não há refluxo de topo nem de fundo, evitando submeter o material pesado a aquecimento repetido.'],['<b>Topo / lateral:</b> Gasóleo de Vácuo (GOV), fração nobre destilada usada como carga para o Craqueamento Catalítico (FCC).','<b>Fundo:</b> Resíduo de Vácuo (RV), fração ultrapesada para asfalto, óleo combustível pesado, coqueamento ou desasfaltação.']],
'UDASF':['Desasfaltação a Propano (Extração com Solvente)','Resíduo de Vácuo (RV).',['Processo de extração líquido-líquido (agente de massa por solubilidade, sem reação química).','O RV entra em uma torre de extração em contracorrente e recebe uma mistura de solventes leves (como propano e butano).','O solvente dissolve e recupera seletivamente as frações oleosas leves e nobres contidas no resíduo, separando-as do material pesado rico em asfaltenos e resinas.'],['<b>Fase extrato:</b> Óleo Desasfaltado (ODES), fração oleosa recuperada usada como carga para craqueamento.','<b>Fase rafinado:</b> Resíduo Asfáltico (RASF), fração concentrada em asfaltenos.']]};

const OBJ={

'Tanque de desidratação':['Remover a água emulsionada e os sais do óleo até BS&W < 1% e sais < 300 mg/L.','Água e sais causam corrosão, incrustação e riscos em dutos e navios.'],
'Fornalha':['Aquecer o petróleo dessalgado antes da torre de destilação.','A separação por pontos de ebulição só ocorre com a carga já aquecida.'],
'Riser (UFCC)':['Quebrar cataliticamente o GOV em frações leves de alto valor (GLP e gasolina).','O GOV é pesado e de baixo valor; a conversão adapta a produção à demanda do mercado.'],
'Regenerador':['Queimar o coque do catalisador e reativá-lo.','O coque desativa os sítios ativos, e a queima ainda fornece o calor das reações endotérmicas.'],

'Reator de reforma':['Rearranjar a nafta pesada para elevar a octanagem e gerar BTX e H₂.','A nafta de destilação tem baixa octanagem, e os aromáticos são matéria-prima petroquímica nobre.'],
'Fornalha de reaquecimento':['Repor o calor perdido entre os reatores da reforma.','As reações principais são fortemente endotérmicas, e a temperatura cai ao longo dos reatores.'],
'Tambor de coque':['Converter termicamente resíduos pesados em produtos leves e coque verde.','RV, RAT e OD têm baixo valor; o coqueamento extrai valor deles sem catalisador.'],
'Absorvedora de amina':['Remover H₂S e CO₂ de gás natural, gás de refinaria e GLP.','Esses gases ácidos causam corrosão, toxicidade e envenenam catalisadores.'],
'Regeneradora de amina':['Recuperar a amina e liberar o H₂S e o CO₂ absorvidos.','Permite reutilizar a amina continuamente, reduzindo custos.'],

'Fornalha de pirólise a vapor':['Produzir olefinas leves (eteno e propeno) por craqueamento térmico.','Eteno e propeno são os petroquímicos básicos que originam os principais polímeros.'],
'Coluna de fracionamento':['Separar e purificar olefinas e aromáticos.','Cada produto básico precisa de alta pureza para a síntese da 2ª geração.'],

'3ª geração':['Transformar resinas em bens de consumo.','É a etapa que entrega os produtos finais ao mercado.']};
const DET3={
'Dessalgadora':['Dessalgadora (Tratamento Pré-Destilação)','Remover o sal (cloretos) e a água residual contidos no petróleo bruto.','A água e o sal no petróleo provocam corrosão severa nas tubulações da refinaria, incrustações nas fornalhas de aquecimento e prejudicam o equilíbrio termodinâmico na torre de destilação.','Petróleo cru bruto aquecido moderadamente em trocadores de calor.','Recebe injeção de água doce de lavagem e desemulsificante sob turbulência. Em seguida, passa por um campo elétrico alternado e rápido, que polariza e força o choque entre as gotículas de água salgada (coalescência), promovendo sua decantação no fundo do vaso.',['<b>Petróleo Dessalgado</b> (que segue aquecido para as fornalhas)','<b>Água Salgada</b> (efluente descartado)']],
'Torre de destilação atmosférica':['Destilação Atmosférica (Pressão de 1 atm)','Fracionar o petróleo cru em famílias de hidrocarbonetos (cortes leves e intermediários) de acordo com suas faixas de temperatura de ebulição.','O petróleo é uma mistura complexa que não pode ser usada de forma bruta; a destilação separa fisicamente essa mistura em frações utilizáveis como combustíveis ou matérias-primas industriais.','Petróleo dessalgado e aquecido a altas temperaturas na fornalha (~350 ºC–400 ºC).','O óleo entra pelo ponto <i>flash</i> no fundo da torre sob pressão de 1 atm. Ao subir pelos pratos teóricos, sofre vaporizações e condensações sucessivas em função da volatilidade das moléculas.',['Gás Combustível (C₁–C₂)','GLP (C₃–C₄) e Nafta Leve (C₅–C₈)','Nafta Pesada (C₁₀–C₁₂)','Querosene (C₁₁–C₁₂)','Gasóleo Atmosférico (C₁₃–C₂₅)','<b>Resíduo Atmosférico (RAT)</b> (frações pesadas do fundo que não vaporizaram)']],
'Torre de vácuo':['Destilação a Vácuo (Pressão Reduzida)','Separar o Gasóleo de Vácuo (GOV) contido no Resíduo Atmosférico (RAT), reduzindo a pressão da torre para evitar o craqueamento térmico indesejado (degradação por calor excessivo) das moléculas pesadas.','As moléculas do RAT têm massa molar alta e exigiriam temperaturas acima de 400 ºC para volatilizar sob pressão normal, o que causaria quebra térmica e formação de coque no equipamento. Com pressão reduzida (vácuo), o ponto de ebulição cai, permitindo a separação em temperaturas operacionais seguras.','Resíduo Atmosférico (RAT) aquecido na fornalha.','Um sistema de ejetores de vácuo em 3 estágios gera pressão reduzida na torre. Ao contrário da torre atmosférica, não se utiliza refluxo de topo nem de fundo, para evitar reaquecer o material pesado.',['<b>Gasóleo de Vácuo (GOV)</b> (fração destilada que serve como carga nobre para o Craqueamento Catalítico – FCC)','<b>Resíduo de Vácuo (RV)</b> (fração ultrapesada do fundo)']],
'UDASF':['Desasfaltação a Propano (Extração com Solvente)','Extrair e recuperar frações oleosas de alto valor contidas no Resíduo de Vácuo (RV), separando o óleo útil das frações pesadas ricas em asfaltenos e metais.','O RV ainda contém moléculas de óleo valiosas que não puderam ser vaporizadas nem no vácuo. Como o RV não pode ser destilado, utiliza-se a solubilidade química em solventes leves para lavar e extrair esse óleo.','Resíduo de Vácuo (RV) + solvente leve (mistura de propano e/ou butano).','Processo de extração líquido-líquido em contracorrente. O propano dissolve seletivamente o óleo leve presente no RV, enquanto os asfaltenos pesados permanecem insolúveis e precipitam.',['<b>Óleo Desasfaltado (ODES)</b> (fração oleosa limpa enviada como carga de conversão para o craqueamento)','<b>Resíduo Asfáltico (RASF)</b> (fração concentrada em asfaltenos usada para produção de asfalto ou óleo combustível pesado)']]};

const X=[`<hr><p><b>▶ Entra:</b> matéria orgânica (algas, micro-organismos) soterrada com sedimentos de baixa permeabilidade.<br><b>◀ Sai:</b> petróleo bruto (óleo + gás natural + água).</p><p><b>Definição:</b> do latim <i>petra</i> (pedra) + <i>oleum</i> (óleo): mistura natural de HCs nos estados gasoso, líquido ou sólido (xisto), com compostos de S, N, O e metais.</p><p><b>Estágios (temperatura):</b> diagênese &lt;65 °C · catagênese 60–150 °C (janela do óleo) · metagênese 150–210 °C · metamorfismo &gt;210 °C.</p><p><b>Composição (% massa):</b> C 83–87 · H 10–14 · S 0,05–6 · N 0,1–2 · O 0,05–1,5 · metais (Fe, Ni, V, Na) &lt;0,3. Séries de HCs: parafinas, naftênicos, olefinas, aromáticos.</p><p><b>Contaminantes e problemas:</b><br>• Sulfurados (~0,65%; mais S em óleo denso): sulfetos, benzotiofenos, H₂S → corrosão, SOx, envenenam catalisadores, estabilizam emulsões.<br>• Nitrogenados (piridinas, quinolinas, porfirinas): estáveis, nas frações pesadas → gomas, veneno de catalisador.<br>• Oxigenados (ácidos naftênicos, fenóis): corrosão ácida, odor, cor, gomas.<br>• Metais: Na reduz o ponto de fusão dos refratários; V ataca tubos de exaustão.<br>• Resinas (solúveis) e asfaltenos (coloidais, escuros, não voláteis).</p>`,
`<hr><p><b>▶ Entra:</b> fluido bruto do poço (óleo + gás + água/sais + sedimentos).<br><b>◀ Sai:</b> óleo estabilizado (BS&amp;W &lt;1%), gás e água tratada.</p><p><b>1ª etapa – separação gás-óleo-água livre:</b> separadores por diferença de densidade (gravidade); podem exigir antiespumantes.</p><p><b>2ª etapa – desidratação e dessalgação:</b> a água forma emulsão água-óleo estabilizada por emulsificantes naturais do petróleo.<br>• Químico: desemulsificantes (cabeça polar + cauda apolar) rompem a interface; exigem tempo de residência e turbulência para a coalescência.<br>• Físico: campo elétrico alternado na dessalgadora acelera o choque das gotas.</p><p><b>Meta:</b> BS&amp;W &lt;1% e sais &lt;300 mg/L, evitando incrustação e corrosão.</p>`,
`<hr><p><b>▶ Entra:</b> óleo cru do processamento primário.<br><b>◀ Sai:</b> gás combustível, GLP, nafta, querosene, gasóleo, GOV, ODES e RASF.</p><p><b>Refino:</b> separação (física) · conversão (química) · tratamento · auxiliares (ex.: H₂). Fração = faixa de HCs com ponto de ebulição e nº de carbonos parecidos. Agentes: energia (T e P: destilações) e massa (solvente: UDASF).</p><p><b>Dessalgadora:</b> desemulsificante + turbulência/residência controladas + campo elétrico → coalescência. Protege fornalhas e tubulações de sal e água.</p><p><b>Destilação atmosférica (1 atm):</b> carga entra no ponto <i>flash</i>; pratos com equilíbrio líquido-vapor; refluxo de topo e refervedor de fundo.<br>• Gás combustível C₁–C₂ · GLP C₃–C₄<br>• Nafta leve C₅–C₈ / pesada C₁₀–C₁₂ (gasolina, petroquímica)<br>• Querosene C₁₁–C₁₂ (QAV) · gasóleo atmosférico C₁₃–C₂₅ (diesel)<br>• RAT (fundo)</p><p><b>Destilação a vácuo:</b> carga RAT; vácuo por ejetores em 3 estágios (pré, inter e pós-condensadores); sem refluxo de topo nem de fundo, para não reaquecer o pesado. Sai GOV (carga do FCC) e RV (asfalto, óleo combustível, coque).</p><p><b>UDASF:</b> extração líquido-líquido do RV com propano → ODES + resíduo asfáltico.</p>`,
`<hr><p><b>▶ Entra:</b> GOV (UFCC) · nafta pesada hidrotratada (reforma) · RAT/RV/OD (coque).<br><b>◀ Sai:</b> GLP, gasolina, LCO, OD · nafta reformada, BTX, H₂ · gás, nafta, gasóleos e coque verde.</p><p><b>Conversão:</b> altera a estrutura química (quebra, rearranjo, ligação) para adaptar a produção à demanda.</p><p><b>UFCC:</b> quebra C–C do GOV (~C₂₅₊) em GLP e gasolina. Catalisador: pó de zeólita + caulim + alumina/sílica, fluidizado por vapor. Via carbocátion C⁺. Primárias endotérmicas (quebra); secundárias exotérmicas (isomerização, transferência de H, coque). O regenerador queima parcialmente o coque (CO) com ar, reativando o catalisador e fornecendo calor ao <i>riser</i>; gases vão à caldeira de CO. Fracionadora: gás combustível, GLP, nafta, LCO e OD.</p><p><b>Reforma:</b> nafta pesada, sem mudar o nº de C. Gera gasolina de alta octanagem, BTX e H₂. Pré-tratamento HDT (Ni-Mo/Co-Mo) remove S, N, O e metais. Catalisador Pt-Re em alumina clorada (função metálica + ácida). Principais (endotérmicas): desidrociclização, desidrogenação, isomerização. Indesejáveis: hidrocraqueamento e coque. Reatores em série com fornalhas de reaquecimento + estabilizadora.</p><p><b>Coqueamento retardado:</b> térmico, sem catalisador (radicais livres: iniciação, propagação, terminação). Carga RAT, RV, OD. A coqueificação é <i>retardada</i> para os tambores (~500 °C), evitando entupir as serpentinas (vapor/água dá turbulência). Dois tambores em batelada (ciclo ~24 h: enche × resfria e descoqueia). Coque esponja/<i>shot</i> (asfaltenos, mais S e metais) e coque agulha (aromáticos, grafítico, alto valor).</p>`,
`<hr><p><b>▶ Entra:</b> gás natural, gás de refinaria, GLP, nafta e querosene com H₂S, CO₂ e mercaptans.<br><b>◀ Sai:</b> derivados dessulfurizados/adoçados; H₂S e CO₂ (topo da regeneradora); dissulfetos; soda exausta (lavagem).</p><p>Contaminantes vêm do cru ou se formam no craqueamento; a escolha do processo depende da fração e do teor de contaminantes.</p><p><b>Aminas (MEA primária, DEA secundária, MDEA terciária):</b> absorção química reversível. Amina pobre na absorvedora → amina rica → regeneradora (aquecimento libera H₂S/CO₂) → volta ao ciclo.<br>H₂S + R₂NH ⇄ R₂NH₂⁺ + HS⁻ (rápida)<br>CO₂ + 2R₂NH ⇄ R₂NCOO⁻ + R₂NH₂⁺ (moderada)<br>CO₂ + H₂O + R₂NH ⇄ R₂NH₂⁺HCO₃⁻ (lenta)<br>MEA: reativa, estável, barata e seletiva ao H₂S.</p><p><b>Lavagem cáustica (não regenerativa):</b> GLP/gasolina. NaOH neutraliza H₂S, RSH, COS e ácidos carboxílicos:<br>H₂S + 2NaOH → Na₂S + 2H₂O<br>RSH + NaOH → NaSR + H₂O<br>A soda não é recuperada: troca periódica e descarte do efluente. Etapas: mistura em tambores, decantação e lavagem final com água.</p><p><b>MEROX / TCR (<i>mercaptan oxidation</i>):</b> GLP (extração) e nafta/querosene (adoçamento). Catalisador de ftalocianina de cobalto sulfonado.<br>2RSH + 2NaOH → 2NaRS + 2H₂O<br>2NaRS + H₂O + ½O₂ → RSSR + 2NaOH (soda regenerada)<br>Global: 2RSH + ½O₂ → RSSR + H₂O</p>`,
`<hr><p><b>▶ Entra:</b> nafta, etano/propano/butano, gases de refinaria, propeno do FCC, nafta pesada C₆–C₈.<br><b>◀ Sai:</b> eteno, propeno, butadieno, BTX, metanol/amônia → polímeros e bens de consumo.</p><p><b>Refino × petroquímica:</b> refino = misturas complexas, maior escala, menor capital, matéria-prima petróleo. Petroquímica = espécies puras, menor escala, maior capital, matéria-prima nafta e gás natural.</p><p><b>1ª geração:</b> olefinas (eteno, propeno, buteno, butadieno), BTX, gás de síntese (metanol, amônia).<br><b>2ª geração:</b> cloreto de vinila e MEG (eteno), acrilonitrila (propeno), estireno, fenol, LAB (benzeno), ácido tereftálico (xilenos), formol, ureia.<br><b>3ª geração:</b> PE, PVC, PP, PS, PET; fibras (náilon, poliéster); borrachas SBR/BR, espumas PU, resinas, detergentes; fertilizantes.</p><p><b>Matérias-primas:</b> metano → metanol e amônia; etano → pirólise (eteno 75–80%); propano/butano → olefinas (butano também a butadieno); nafta parafínica de baixo S (eteno ~28–30%); propeno do FCC recuperado a &gt;99,5%.</p><p><b>Pirólise a vapor:</b> térmica, endotérmica, &gt;700 °C e &lt;200 kPa. Reações: craqueamento, desidrogenação, condensação (nafta de pirólise), coque. Facilidade: parafina &gt; isoparafina &gt; naftênico.</p><p><b>Aromáticos:</b> reforma da nafta pesada C₆–C₈ em leito fixo → BTX.<br><b>Rotas verdes:</b> etanol de cana → eteno verde; glicerina do biodiesel → propeno; açúcares → ácidos e álcoois.</p>`];
